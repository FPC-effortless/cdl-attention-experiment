name: CASM-X explicit computation

on:
  push:
    branches:
      - experiment/casm-x-explicit-computation
    paths:
      - "casm_v01/casm/explicit_compute.py"
      - "casm_v01/casm/run_explicit_compute.py"
      - "casm_v01/tests/test_explicit_compute.py"
      - "casm_v01/EXPERIMENT_CASM_X.md"
      - ".github/workflows/casm-x-explicit-computation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Run CASM-X integrity tests
        run: |
          PYTHONPATH=casm_v01 pytest -q casm_v01/tests/test_explicit_compute.py

  train-evaluate:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 20260831
            eval_seed: 20260911
          - seed: 20260832
            eval_seed: 20260912
          - seed: 20260833
            eval_seed: 20260913
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train and evaluate CASM-X
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.run_explicit_compute \
            --steps 1800 \
            --batch-size 128 \
            --train-max-depth 3 \
            --eval-n 512 \
            --eval-batch-size 128 \
            --seed ${{ matrix.seed }} \
            --eval-seed ${{ matrix.eval_seed }} \
            --output casm-x-output/results-${{ matrix.seed }}.json \
            --checkpoint-dir casm-x-output/checkpoints-${{ matrix.seed }}
      - name: Print decisive metrics
        working-directory: casm_v01
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = next(Path("casm-x-output").glob("results-*.json"))
          report = json.loads(path.read_text())
          print("parameters", report["parameters"])
          for suite in (
              "iid_depth_3",
              "composition_depth_4",
              "composition_depth_6",
              "stress_depth_8",
              "stress_depth_12",
          ):
              row = report["evaluation"][suite]
              print("\n", suite)
              for model in (
                  "explicit_verified",
                  "explicit_no_verifier",
                  "explicit_oracle_routing",
                  "explicit_oracle_execution",
                  "explicit_oracle_both",
                  "shared_transition",
                  "gru_program",
              ):
                  print(model, row[model]["final_state_exact"])
          for suite, row in report["evaluation"].items():
              if suite == "efficiency":
                  continue
              assert row["explicit_oracle_both"]["final_state_exact"] == 1.0, suite
          print("oracle integrity ceiling PASS")
          PY
      - name: Upload CASM-X result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-x-seed-${{ matrix.seed }}
          path: casm_v01/casm-x-output/
          if-no-files-found: error
          retention-days: 90
