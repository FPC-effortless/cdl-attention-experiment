name: Replay CASM experiments — unified harness v2

on:
  push:
    branches:
      - benchmark/unified-harness-v2
    paths:
      - "casm_v01/**"
      - ".github/workflows/replay-casm-unified-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: replay-${{ matrix.experiment }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        experiment:
          - base-compression
          - answer-utility
          - recurrent
          - scoped-memory
          - process-supervision
          - deep-answer
          - capacity-floor
          - answer-state
    env:
      PYTHONHASHSEED: "20260831"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest

      - name: Assemble cumulative CASM model
        run: |
          cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py

      - name: Unified harness regression gate
        run: |
          PYTHONPATH=casm_v01 pytest -q \
            casm_v01/tests/test_benchmark_harness_v2.py \
            casm_v01/tests/test_recurrent_reasoning.py \
            casm_v01/tests/test_process_supervision.py \
            casm_v01/tests/test_answer_state.py

      - name: Train historical intervention
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p replay/${{ matrix.experiment }}
          case "${{ matrix.experiment }}" in
            base-compression)
              PYTHONPATH=casm_v01 python -m casm.train \
                --tiny --steps 600 --batch-size 12 --seq-len 129 \
                --eval-batches 8 --seed 20260829 \
                --models local-only,qk-memory,compression,compression-qk \
                --out replay/base-compression
              ;;
            answer-utility)
              PYTHONPATH=casm_v01 python -m casm.train_answer_utility \
                --tiny --steps 1000 --batch-size 8 --seq-len 289 \
                --eval-batches 8 --seed 20261011 \
                --out replay/answer-utility
              ;;
            recurrent)
              PYTHONPATH=casm_v01 python -m casm.train_recurrent \
                --tiny --steps 2000 --batch-size 8 --seq-len 289 \
                --eval-batches 8 --seed 20261101 \
                --out replay/recurrent
              ;;
            scoped-memory)
              PYTHONPATH=casm_v01 python -m casm.train_recurrent_scoped \
                --tiny --steps 2000 --batch-size 16 --seq-len 289 \
                --eval-batches 8 --seed 20261121 \
                --out replay/scoped-memory
              ;;
            process-supervision)
              PYTHONPATH=casm_v01 python -m casm.train_process \
                --tiny --steps 2000 --batch-size 12 --seq-len 385 \
                --eval-batches 8 --seed 20261201 \
                --out replay/process-supervision
              ;;
            deep-answer)
              PYTHONPATH=casm_v01 python -m casm.train_deep_answer \
                --tiny --steps 2000 --batch-size 12 --seq-len 385 \
                --eval-batches 8 --seed 20261221 \
                --out replay/deep-answer
              ;;
            capacity-floor)
              PYTHONPATH=casm_v01 python -m casm.train_capacity_floor \
                --steps 1200 --batch-size 12 --seq-len 385 \
                --seed 20261301 --out replay/capacity-floor
              ;;
            answer-state)
              PYTHONPATH=casm_v01 python -m casm.train_answer_state \
                --steps 2000 --batch-size 16 --seq-len 385 \
                --eval-batches 8 --seed 20261221 \
                --out replay/answer-state
              ;;
          esac

      - name: Run unified capability and efficiency harness
        shell: bash
        run: |
          set -euxo pipefail
          COMMON="--n-per-task 20 --stress-n 8 --graph-per-label 20 --max-new-tokens 20 --profile-seq-lens 96,192,384 --profile-batch 4 --decode-steps 8 --warmup 1 --iters 1"
          case "${{ matrix.experiment }}" in
            base-compression)
              PYTHONPATH=casm_v01 python -m casm.benchmark_harness_v2 \
                --family base \
                --checkpoints replay/base-compression/local-only.pt replay/base-compression/qk-memory.pt replay/base-compression/compression.pt replay/base-compression/compression-qk.pt \
                --control local-only --output replay/base-compression/unified-harness.json $COMMON
              ;;
            answer-utility)
              PYTHONPATH=casm_v01 python -m casm.benchmark_harness_v2 \
                --family base \
                --checkpoints replay/answer-utility/qk-memory.pt replay/answer-utility/compression-qk.pt replay/answer-utility/answer-utility-qk.pt \
                --control qk-memory --output replay/answer-utility/unified-harness.json $COMMON
              ;;
            recurrent)
              PYTHONPATH=casm_v01 python -m casm.benchmark_harness_v2 \
                --family recurrent \
                --checkpoints replay/recurrent/qk-1step.pt replay/recurrent/qk-3step.pt replay/recurrent/set-utility-3step.pt \
                --control qk-1step --output replay/recurrent/unified-harness.json $COMMON
              ;;
            scoped-memory)
              PYTHONPATH=casm_v01 python -m casm.benchmark_harness_v2 \
                --family recurrent \
                --checkpoints replay/scoped-memory/scoped-qk-1step.pt replay/scoped-memory/scoped-qk-3step.pt \
                --control scoped-qk-1step --output replay/scoped-memory/unified-harness.json $COMMON
              ;;
            process-supervision)
              PYTHONPATH=casm_v01 python -m casm.benchmark_harness_v2 \
                --family recurrent \
                --checkpoints replay/process-supervision/final-only-3step.pt replay/process-supervision/process-3step.pt \
                --control final-only-3step --output replay/process-supervision/unified-harness.json $COMMON
              ;;
            deep-answer)
              PYTHONPATH=casm_v01 python -m casm.benchmark_harness_v2 \
                --family recurrent \
                --checkpoints replay/deep-answer/final-only-3step.pt replay/deep-answer/deep-answer-3step.pt \
                --control final-only-3step --output replay/deep-answer/unified-harness.json $COMMON
              ;;
            capacity-floor)
              PYTHONPATH=casm_v01 python -m casm.benchmark_harness_v2 \
                --family recurrent \
                --checkpoints replay/capacity-floor/state-only.pt replay/capacity-floor/graph-only.pt \
                --output replay/capacity-floor/unified-harness.json $COMMON
              ;;
            answer-state)
              PYTHONPATH=casm_v01 python -m casm.benchmark_harness_v2 \
                --family answer-state \
                --checkpoints replay/answer-state/answer-state-1step.pt replay/answer-state/answer-state-3step.pt \
                --control answer-state-1step --output replay/answer-state/unified-harness.json $COMMON
              ;;
          esac

      - name: Record replay metadata
        shell: bash
        run: |
          python - <<'PY'
          import json, os, platform, torch
          from pathlib import Path
          exp = os.environ["EXP"]
          out = Path("replay") / exp
          (out / "replay-metadata.json").write_text(json.dumps({
              "experiment": exp,
              "harness": "casm-unified-v2-2026-08-31",
              "python": platform.python_version(),
              "torch": torch.__version__,
              "device": "cpu",
              "github_sha": os.environ.get("GITHUB_SHA"),
          }, indent=2))
          PY
        env:
          EXP: ${{ matrix.experiment }}

      - name: Upload replay artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-${{ matrix.experiment }}-unified-v2
          path: replay/${{ matrix.experiment }}/
          if-no-files-found: warn
          retention-days: 90
