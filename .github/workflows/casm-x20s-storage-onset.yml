name: CASM-X20S storage-onset scheduling

on:
  push:
    branches:
      - experiment/casm-x20s-storage-onset
    paths:
      - "casm_v01/EXPERIMENT_CASM_X20S.md"
      - "casm_v01/casm/state_instantiation_schedule.py"
      - "casm_v01/casm/run_state_instantiation_schedule.py"
      - "casm_v01/tests/test_state_instantiation_schedule.py"
      - ".github/workflows/casm-x20s-storage-onset.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Verify frozen X20R base and preregistration ordering
        run: |
          git merge-base --is-ancestor a4b8ee98dd300dc51e4398c84020a2e90c2cccc6 HEAD
          git merge-base --is-ancestor cc9168011e8a2f578bc7dce9879dc42a6161e201 HEAD
          git diff --exit-code a4b8ee98dd300dc51e4398c84020a2e90c2cccc6 -- \
            casm_v01/casm/state_instantiation_data.py \
            casm_v01/casm/state_instantiation_model.py \
            casm_v01/casm/run_state_instantiation.py \
            casm_v01/casm/state_instantiation_st.py \
            casm_v01/casm/run_state_instantiation_st.py \
            casm_v01/tests/test_state_instantiation.py \
            casm_v01/tests/test_state_instantiation_st.py
      - name: Install pinned scientific environment
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "pytest==9.1.1"
          python - <<'PY'
          import platform, torch
          assert platform.python_version() == "3.11.16", platform.python_version()
          assert torch.__version__ == "2.14.0+cpu", torch.__version__
          print(platform.python_version(), torch.__version__)
          PY
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Run inherited and X20S integrity tests
        run: |
          PYTHONPATH=casm_v01 pytest -q \
            casm_v01/tests/test_cardinality_valid_executor.py \
            casm_v01/tests/test_state_instantiation.py \
            casm_v01/tests/test_state_instantiation_st.py \
            casm_v01/tests/test_state_instantiation_schedule.py

  train-evaluate:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 20261191
            eval_seed: 20261271
          - seed: 20261192
            eval_seed: 20261272
          - seed: 20261193
            eval_seed: 20261273
          - seed: 20261194
            eval_seed: 20261274
          - seed: 20261195
            eval_seed: 20261275
          - seed: 20261196
            eval_seed: 20261276
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install pinned scientific environment
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          python - <<'PY'
          import platform, torch
          assert platform.python_version() == "3.11.16"
          assert torch.__version__ == "2.14.0+cpu"
          PY
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Train and evaluate X20S schedule regimes
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.run_state_instantiation_schedule \
            --steps 12000 \
            --batch-size 128 \
            --train-depth 12 \
            --eval-n 256 \
            --eval-batch-size 64 \
            --seed ${{ matrix.seed }} \
            --eval-seed ${{ matrix.eval_seed }} \
            --output casm-x20s-output/results-${{ matrix.seed }}.json
      - name: Validate X20S provenance contract
        working-directory: casm_v01
        run: |
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          p = next(Path("casm-x20s-output").glob("results-*.json"))
          r = json.loads(p.read_text())
          assert r["harness_version"] == "casm-x20s-storage-onset-v0-2026-09-04"
          assert r["git_sha"] == os.environ["GITHUB_SHA"]
          assert r["python_version"] == "3.11.16"
          assert r["torch_version"] == "2.14.0+cpu"
          assert r["steps"] == 12000 and r["batch_size"] == 128 and r["train_depth"] == 12 and r["eval_n"] == 256
          assert r["candidate_count"] == 8
          assert r["training_live_cardinalities"] == [2,3,4]
          assert r["unseen_live_cardinalities"] == [5,6]
          assert r["training_cardinality_counts"] == {"2":4000,"3":4000,"4":4000}
          learned = (
              "immediate_st",
              "no_storage_st",
              "delayed_abrupt_st",
              "delayed_ramp_st",
              "delayed_ramp_structure_blind",
          )
          assert len({r["parameters"][m] for m in learned}) == 1
          assert len({r["trainable_parameters"][m] for m in learned}) == 1
          c = r["constructor_contract"]
          assert c["learned_live_mask_input"] is False
          assert c["learned_active_cardinality_input"] is False
          assert c["per_candidate_parameter_table"] is False
          assert c["hard_gate_threshold"] == 0.5
          assert c["straight_through_forward_binary"] is True
          assert c["same_estimator_as_x20r"] is True
          assert r["supervision_contract"]["live_mask_loss"] is False
          assert r["supervision_contract"]["cardinality_loss"] is False
          assert r["supervision_contract"]["pretraining_unseen_live_cardinality"] is False
          s = r["schedule_contract"]
          assert s["warmup_steps"] == 1000 and s["ramp_end_step"] == 2000
          assert s["immediate"]["1"] == 0.05 and s["immediate"]["12000"] == 0.05
          assert s["no_storage"]["1"] == 0.0 and s["no_storage"]["12000"] == 0.0
          assert s["delayed_abrupt"]["1000"] == 0.0 and s["delayed_abrupt"]["1001"] == 0.05
          assert abs(s["delayed_ramp"]["1001"] - 0.00005) < 1e-12
          assert abs(s["delayed_ramp"]["1500"] - 0.025) < 1e-12
          assert s["delayed_ramp"]["2000"] == 0.05 and s["delayed_ramp"]["12000"] == 0.05
          for mode in learned:
              assert set(r["initial_gate_stats_train_cardinalities_only"][mode]) == {"2","3","4"}
          for values in (r["minimum_answer_loss"], r["final_answer_loss"], r["maximum_post4000_grad_norm"]):
              assert all(math.isfinite(v) and v >= 0 for v in values.values())
          print("X20S provenance contract PASS")
          PY
      - name: Upload X20S result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-x20s-seed-${{ matrix.seed }}
          path: casm_v01/casm-x20s-output/
          if-no-files-found: error
          retention-days: 90
