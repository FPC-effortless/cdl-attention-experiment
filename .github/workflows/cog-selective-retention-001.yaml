name: COG-RETENTION-TRAIN-001 controlled posttraining
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/cog-math-repair-009-cpu]
    paths:
      - 'research/selective-retention-001/**'
      - '.github/workflows/cog-selective-retention-001.yaml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cog-selective-retention-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '4'
jobs:
  prepare:
    if: (github.event_name == 'workflow_dispatch' && github.ref_name == 'research/cog-selective-retention-001') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'research/cog-selective-retention-001' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.3.5 safetensors==0.7.0 packaging==25.0
      - uses: actions/download-artifact@v4
        with:
          name: corpus
          path: ${{ runner.temp }}/corpus
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '46039004295'
      - run: |
          python research/math-repair-009/recover009.py corpus --data "$RUNNER_TEMP/corpus"
          python research/selective-retention-001/verify.py
          python -m py_compile research/selective-retention-001/*.py
      - uses: actions/upload-artifact@v4
        with:
          name: retention-corpus
          path: ${{ runner.temp }}/corpus
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: retention-kernel-verification
          path: research/selective-retention-001/kernel_verification.json
          retention-days: 30
          if-no-files-found: error
  train:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arm: [native_short, native_long, time_long, write_long, scalar_long, context_long]
        seed: [9001, 9011, 9029]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.3.5 safetensors==0.7.0 packaging==25.0
          python -m pip freeze > "$RUNNER_TEMP/environment.txt"
      - uses: actions/download-artifact@v4
        with:
          name: retention-corpus
          path: ${{ runner.temp }}/corpus
      - uses: actions/download-artifact@v4
        with:
          name: stage4-HH-${{ matrix.seed }}
          path: ${{ runner.temp }}/prior
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '46044686359'
      - name: Exact matched continued pretraining
        run: |
          python research/selective-retention-001/train_retention.py --arm '${{ matrix.arm }}' --seed '${{ matrix.seed }}' --data "$RUNNER_TEMP/corpus" --prior "$RUNNER_TEMP/prior" --out "$RUNNER_TEMP/fit" --threads 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retention-${{ matrix.arm }}-${{ matrix.seed }}
          path: |
            ${{ runner.temp }}/fit/
            ${{ runner.temp }}/environment.txt
          retention-days: 30
          if-no-files-found: warn
  aggregate:
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: retention-*-9*
          path: ${{ runner.temp }}/fits
      - run: python research/selective-retention-001/train_aggregate.py --input "$RUNNER_TEMP/fits" --out "$RUNNER_TEMP/summary/comparison.json"
      - uses: actions/upload-artifact@v4
        with:
          name: retention-comparison
          path: ${{ runner.temp }}/summary
          retention-days: 30
          if-no-files-found: error
