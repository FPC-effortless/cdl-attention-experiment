name: Graded commitment research replay
on:
  push:
    branches: [research/cog-071-080-graded-commitment]
    paths: ['research/cog-071-080/replay.py', '.github/workflows/cog-071-080-replay.yml']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - working-directory: research/cog-071-080
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python replay.py
