name: Replay state-conditioned skills
on:
  push:
    branches: [research/cog-087-090-state-selection]
    paths: ['research/cog-087-090/**', '.github/workflows/cog-087-090-replay.yml']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: research/cog-087-090
        run: python replay.py
