name: CASM-X14 occupancy-state binding

on:
  push:
    branches:
      - experiment/casm-x14-occupancy-state-binding
    paths:
      - "casm_v01/EXPERIMENT_CASM_X14.md"
      - "casm_v01/casm/occupancy_state_binding.py"
      - "casm_v01/casm/run_occupancy_state_binding.py"
      - "casm_v01/tests/test_occupancy_state_binding.py"
      - ".github/workflows/casm-x14-occupancy-state-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Run X14 integrity tests
        run: |
          PYTHONPATH=casm_v01 pytest -q \
            casm_v01/tests/test_cardinality_valid_executor.py \
            casm_v01/tests/test_coordinated_binding.py \
            casm_v01/tests/test_collision_barrier_binding.py \
            casm_v01/tests/test_occupancy_state_binding.py

  train-evaluate:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 20261091
            eval_seed: 20261171
          - seed: 20261092
            eval_seed: 20261172
          - seed: 20261093
            eval_seed: 20261173
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Train and evaluate X14 occupancy regimes
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.run_occupancy_state_binding \
            --steps 10000 \
            --batch-size 128 \
            --train-depth 8 \
            --weight-decay 0.0001 \
            --eval-n 256 \
            --eval-batch-size 64 \
            --seed ${{ matrix.seed }} \
            --eval-seed ${{ matrix.eval_seed }} \
            --output casm-x14-output/results-${{ matrix.seed }}.json
      - name: Validate provenance and print decisive metrics
        working-directory: casm_v01
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = next(Path("casm-x14-output").glob("results-*.json"))
          report = json.loads(path.read_text())
          assert report["harness_version"] == "casm-x14-occupancy-state-binding-v0-2026-09-03"
          assert report["steps"] == 10000
          assert report["batch_size"] == 128
          assert report["train_depth"] == 8
          assert report["eval_n"] == 256
          assert report["training_cardinalities"] == [2,3,4]
          assert report["unseen_cardinalities"] == [5,6]
          assert report["training_cardinality_counts"] == {"2":3334,"3":3333,"4":3333}
          assert report["occupancy_contract"]["refinement_rounds"] == 8
          assert report["occupancy_contract"]["hard_masking"] is False
          assert report["occupancy_contract"]["hard_injectivity"] is False
          assert report["occupancy_contract"]["matching"] is False
          assert report["occupancy_contract"]["sinkhorn"] is False
          assert report["occupancy_contract"]["sorting_assignment"] is False
          assert report["occupancy_contract"]["collision_repair"] is False
          assert report["barrier_contract"]["epsilon"] == 0.001
          assert report["supervision_contract"]["teacher_forcing"] is False
          assert report["supervision_contract"]["intermediate_state_targets"] is False
          assert report["supervision_contract"]["hidden_final_targets"] is False
          assert report["supervision_contract"]["binding_labels"] is False
          assert report["supervision_contract"]["unseen_train_loss_calls"] == 0
          assert set(report["initial_bindings_train_cardinalities_only"]["iterative_occupancy"].keys()) == {"2","3","4"}

          assert report["parameters"]["iterative_no_occupancy"] == report["parameters"]["iterative_occupancy"]
          assert report["trainable_parameters"]["iterative_no_occupancy"] == report["trainable_parameters"]["iterative_occupancy"]

          for values in (
              report["minimum_answer_loss"], report["minimum_total_loss"],
              report["final_answer_loss"], report["final_total_loss"],
              report["maximum_post4000_grad_norm"],
          ):
              assert all(math.isfinite(v) and v >= 0.0 for v in values.values())

          modes = (
              "canonical_functional",
              "x13_one_shot_barrier",
              "iterative_no_occupancy",
              "iterative_occupancy",
          )
          for n in range(2, 7):
              print("\nn", n)
              for learned in modes[1:]:
                  stats = report["final_bindings"][learned][str(n)]
                  for key in ("normalized_row_spread", "slot_capacity_overflow", "collision_barrier"):
                      assert math.isfinite(stats[key]) and stats[key] >= 0.0
                  print(
                      learned,
                      "assignment", stats["independent_argmax_assignment"],
                      "unique", stats["independent_argmax_unique_slot_count"],
                      "collisions", stats["independent_argmax_collision_count"],
                      "row_max", stats["row_max_mean"],
                      "barrier", stats["collision_barrier"],
                  )
              for suite in (
                  "iid_depth_8", "composition_depth_12", "composition_depth_24",
                  "stress_depth_48", "stress_depth_96",
              ):
                  hard = report["evaluation"][str(n)][suite]
                  soft = report["soft_evaluation"][str(n)][suite]
                  for mode in modes:
                      for metrics in (hard[mode], soft[mode]):
                          for key in (
                              "final_state_exact", "step_state_exact", "register_accuracy",
                              "answer_final_accuracy", "answer_step_accuracy",
                              "hidden_register_accuracy", "hidden_final_exact",
                          ):
                              assert math.isfinite(metrics[key]), (n, suite, mode, key, metrics[key])
                      print(
                          suite, mode,
                          "hard_answer", hard[mode]["answer_final_accuracy"],
                          "hard_step", hard[mode]["step_state_exact"],
                          "hard_hidden", hard[mode]["hidden_register_accuracy"],
                          "soft_answer", soft[mode]["answer_final_accuracy"],
                      )
          PY
      - name: Upload X14 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-x14-seed-${{ matrix.seed }}
          path: casm_v01/casm-x14-output/
          if-no-files-found: error
          retention-days: 90
