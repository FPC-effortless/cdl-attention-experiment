name: CASM v0.1 controlled training

on:
  push:
    branches:
      - model/compression-attention-v01
    paths:
      - "casm_v01/**"
      - ".github/workflows/casm-v01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "20260901"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest

      - name: Assemble model source
        run: |
          cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
          python -m py_compile casm_v01/casm/model.py casm_v01/casm/train.py casm_v01/casm/data.py

      - name: Unit and gradient tests
        working-directory: casm_v01
        run: PYTHONPATH=. pytest -q

      - name: Train paired ablations
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.train \
            --tiny \
            --steps 800 \
            --batch-size 8 \
            --seq-len 193 \
            --eval-batches 20 \
            --log-every 100 \
            --compression-warmup 125 \
            --gzip-teacher-decay 650 \
            --gzip-teacher-floor 0.35 \
            --answer-weight 8 \
            --hard-max-prob 0.5 \
            --hard-ramp-steps 500 \
            --seed 20260901 \
            --out casm-output

      - name: Evaluate heterogeneous tasks
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.eval_tasks \
            casm-output/local-only.pt \
            casm-output/qk-memory.pt \
            casm-output/compression.pt \
            --n-per-task 80 \
            --seed 20260902 \
            > casm-output/task-eval.txt
          cat casm-output/task-eval.txt

      - name: Preserve metadata
        working-directory: casm_v01
        run: |
          python - <<'PY'
          import json, platform, torch
          from pathlib import Path
          Path("casm-output/run-metadata.json").write_text(json.dumps({
              "experiment": "CASM-v0.1-controlled-800",
              "seed": 20260901,
              "eval_seed": 20260902,
              "steps_per_variant": 800,
              "train_sequence_bytes": 193,
              "chunk_size": 24,
              "answer_weight": 8,
              "hard_max_probability": 0.5,
              "variants": ["local-only", "qk-memory", "compression"],
              "torch": torch.__version__,
              "python": platform.python_version(),
              "device": "cpu"
          }, indent=2))
          PY

      - name: Upload CASM v0.1 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-v01-results
          path: casm_v01/casm-output/
          if-no-files-found: warn
          retention-days: 90
