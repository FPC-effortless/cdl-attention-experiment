name: CASM-X4 partial final answer

on:
  push:
    branches:
      - experiment/casm-x4-partial-final-answer
    paths:
      - "casm_v01/casm/partial_final_answer.py"
      - "casm_v01/casm/run_partial_final_answer.py"
      - "casm_v01/tests/test_partial_final_answer.py"
      - "casm_v01/EXPERIMENT_CASM_X4.md"
      - ".github/workflows/casm-x4-partial-final-answer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Run X4 integrity tests
        run: PYTHONPATH=casm_v01 pytest -q casm_v01/tests/test_partial_final_answer.py casm_v01/tests/test_weak_supervision.py

  train-evaluate:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 20260891
            eval_seed: 20260971
          - seed: 20260892
            eval_seed: 20260972
          - seed: 20260893
            eval_seed: 20260973
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Train and evaluate partial terminal regimes
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.run_partial_final_answer \
            --steps 4000 \
            --batch-size 128 \
            --train-depth 8 \
            --eval-n 384 \
            --eval-batch-size 64 \
            --seed ${{ matrix.seed }} \
            --eval-seed ${{ matrix.eval_seed }} \
            --output casm-x4-output/results-${{ matrix.seed }}.json
      - name: Validate and print decisive metrics
        working-directory: casm_v01
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          path = next(Path("casm-x4-output").glob("results-*.json"))
          report = json.loads(path.read_text())
          assert report["supervision_contract"]["teacher_forcing"] is False
          assert report["supervision_contract"]["semantic_operator_labels"] is False
          assert report["supervision_contract"]["intermediate_state_targets"] is False
          assert len(set(report["parameters"].values())) == 1
          counts = report["query_counts"]
          total = sum(counts)
          assert all(abs(c / total - 0.25) < 0.01 for c in counts), counts
          print("parameters", report["parameters"])
          print("query_counts", counts)
          for suite in ("iid_depth_8", "composition_depth_12", "composition_depth_24", "stress_depth_48", "stress_depth_96"):
              row = report["evaluation"][suite]
              print("\n", suite)
              for regime in ("full_final", "one_register", "one_parity_bit"):
                  metrics = row[regime]
                  for key in ("final_state_exact", "step_state_exact", "register_accuracy"):
                      assert math.isfinite(metrics[key]), (suite, regime, key, metrics[key])
                  print(regime, metrics["final_state_exact"], metrics["step_state_exact"], metrics["register_accuracy"])
          PY
      - name: Upload X4 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-x4-seed-${{ matrix.seed }}
          path: casm_v01/casm-x4-output/
          if-no-files-found: error
          retention-days: 90
