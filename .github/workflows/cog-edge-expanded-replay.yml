name: COG-EDGE expanded evidence independent replay
on:
  pull_request:
    paths:
      - 'research/cog-edge-expanded-replay/**'
      - '.github/workflows/cog-edge-expanded-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - run: |
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch and verify permanent original evidence
        run: |
          set -euo pipefail
          mkdir -p ci-replay "${RUNNER_TEMP}/receipts"
          git fetch --no-tags --depth=1 origin refs/heads/research/cog-edge-v01-expanded-evidence-46052547333-1
          test "$(git rev-parse FETCH_HEAD)" = 78a432daec384336911b97852f7995ea47f0ccc5
          git archive FETCH_HEAD research/cog-edge-v01-expanded/ci-evidence/46052547333-1 | tar -x -C "${RUNNER_TEMP}/receipts"
          cd "${RUNNER_TEMP}/receipts/research/cog-edge-v01-expanded/ci-evidence/46052547333-1"
          sha256sum -c SHA256SUMS.txt | tee "${GITHUB_WORKSPACE}/ci-replay/custody.log"
          test "$(find . -type f -name '*.pt' | wc -l)" = 135
      - name: Reconstruct original telemetry independently
        run: |
          set -euo pipefail
          python research/cog-edge-v01/restore.py --out "${RUNNER_TEMP}/edge"
          python research/cog-edge-v01-expanded/prepare_expanded.py --restored-source "${RUNNER_TEMP}/edge" --archive research/cog-drone-audit/archives/COG-DRONE-002-006-evidence.zip --out "${RUNNER_TEMP}/expanded.npz" 2>&1 | tee ci-replay/acquisition.log
      - name: Independent replay, matched-denominator audit and history intervention
        run: |
          set -euo pipefail
          python research/cog-edge-expanded-replay/replay.py --restored "${RUNNER_TEMP}/edge" --dataset "${RUNNER_TEMP}/expanded.npz" --archived "${RUNNER_TEMP}/receipts/research/cog-edge-v01-expanded/ci-evidence/46052547333-1" --out ci-replay/results.json 2>&1 | tee ci-replay/replay.log
          python -m pip freeze > ci-replay/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expanded-independent-replay
          path: ci-replay/
          if-no-files-found: warn
      - name: Preserve run-specific evidence
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/cog-edge-expanded-replay'
        run: |
          set -euo pipefail
          test -d ci-replay || exit 0
          git config user.name "COG research CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dst="research/cog-edge-expanded-replay/ci-evidence/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$dst"
          cp -a ci-replay/. "$dst/"
          (cd "$dst"; find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          git add -f "$dst"
          git diff --cached --quiet && exit 0
          git commit -m "Preserve expanded replay $GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/research/cog-edge-expanded-replay-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
