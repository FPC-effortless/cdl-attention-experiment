name: CASM-D directional pilot

on:
  push:
    branches:
      - experiment/casm-d-deep-answer
    paths:
      - ".github/workflows/casm-d-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONHASHSEED: "20261219"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Assemble
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Train 600-step pilot
        run: |
          PYTHONPATH=casm_v01 python -m casm.train_deep_answer \
            --tiny --steps 600 --batch-size 10 --seq-len 385 --eval-batches 6 \
            --log-every 100 --answer-weight 12 \
            --hard-max-prob 0.5 --hard-ramp-steps 300 \
            --deep-start 80 --deep-warmup 160 --deep-weight 0.35 \
            --seed 20261219 --out casm-d-pilot-output
      - name: Hard task likelihood
        run: |
          PYTHONPATH=casm_v01 python -m casm.eval_process \
            casm-d-pilot-output/final-only-3step.pt \
            casm-d-pilot-output/deep-answer-3step.pt \
            --mode task --hard --n 60 --seed 20261227 \
            > casm-d-pilot-output/task-hard.txt
      - name: Hard task free generation
        run: |
          PYTHONPATH=casm_v01 python -m casm.eval_process \
            casm-d-pilot-output/final-only-3step.pt \
            casm-d-pilot-output/deep-answer-3step.pt \
            --mode freegen-task --hard --n 30 --max-new-tokens 20 --seed 20261228 \
            > casm-d-pilot-output/freegen-task-hard.txt
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-d-pilot-results
          path: casm-d-pilot-output/
          retention-days: 30
