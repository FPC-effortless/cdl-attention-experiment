name: COG-LM CPU invariants
on:
  pull_request:
    paths:
      - 'research/cog_lm_001/**'
      - 'research/cog_lm_002/**'
      - 'research/cog_lm_003/**'
      - '.github/workflows/cog-lm-001.yml'
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.3.5 einops==0.8.1 tokenizers==0.22.1 pytest==9.0.2 pyarrow==18.1.0
      - run: python research/cog_lm_003/parity.py
      - run: python -m pytest -q research/cog_lm_001/test_lm.py research/cog_lm_002/test_runtime.py
