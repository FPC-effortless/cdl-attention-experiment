name: CASM-X19 recursive role construction

on:
  push:
    branches:
      - experiment/casm-x19-recursive-role-construction
    paths:
      - "casm_v01/EXPERIMENT_CASM_X19.md"
      - "casm_v01/PLM_CORE_ARCHITECTURE.md"
      - "casm_v01/casm/recursive_role_construction.py"
      - "casm_v01/casm/run_recursive_role_construction.py"
      - "casm_v01/tests/test_recursive_role_construction.py"
      - ".github/workflows/casm-x19-recursive-role-construction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Run X19 integrity tests
        run: |
          PYTHONPATH=casm_v01 pytest -q \
            casm_v01/tests/test_cardinality_valid_executor.py \
            casm_v01/tests/test_collision_barrier_binding.py \
            casm_v01/tests/test_recursive_role_construction.py

  train-evaluate:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 20261151
            eval_seed: 20261231
          - seed: 20261152
            eval_seed: 20261232
          - seed: 20261153
            eval_seed: 20261233
          - seed: 20261154
            eval_seed: 20261234
          - seed: 20261155
            eval_seed: 20261235
          - seed: 20261156
            eval_seed: 20261236
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Train and evaluate X19 role regimes
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.run_recursive_role_construction \
            --steps 10000 \
            --batch-size 128 \
            --train-depth 8 \
            --weight-decay 0.0001 \
            --eval-n 256 \
            --eval-batch-size 64 \
            --seed ${{ matrix.seed }} \
            --eval-seed ${{ matrix.eval_seed }} \
            --output casm-x19-output/results-${{ matrix.seed }}.json
      - name: Validate provenance and contracts
        working-directory: casm_v01
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          path = next(Path("casm-x19-output").glob("results-*.json"))
          r = json.loads(path.read_text())
          assert r["harness_version"] == "casm-x19-recursive-role-construction-v0-2026-09-04"
          assert r["steps"] == 10000 and r["batch_size"] == 128 and r["train_depth"] == 8 and r["eval_n"] == 256
          assert r["training_cardinalities"] == [2,3,4]
          assert r["unseen_cardinalities"] == [5,6]
          assert r["training_cardinality_counts"] == {"2":3334,"3":3333,"4":3333}
          assert r["parameters"]["static_global_roles"] == r["parameters"]["recursive_roles"]
          assert r["trainable_parameters"]["static_global_roles"] == r["trainable_parameters"]["recursive_roles"]
          assert r["role_contract"]["role_dim"] == 32
          assert r["role_contract"]["diagnostic_role_count"] == 8
          assert r["role_contract"]["recursive_external_index_input"] is False
          assert r["role_contract"]["recursive_active_cardinality_input"] is False
          assert r["role_contract"]["learned_role_index_table"] is False
          assert r["storage_bridge_contract"]["dual_prices"] is False
          assert r["storage_bridge_contract"]["matching"] is False
          assert r["storage_bridge_contract"]["collision_repair"] is False
          assert r["supervision_contract"]["pretraining_unseen_role_generation"] is False
          for mode in ("static_global_roles", "recursive_roles"):
              assert set(r["initial_bindings_train_cardinalities_only"][mode]) == {"2","3","4"}
              d = r["role_diagnostics_posttraining_only"][mode]
              assert d["count"] == 8 and len(d["role_norms"]) == 8
              assert len(d["hard_storage_preferences"]) == 8
              for n in range(2,7):
                  s = r["final_bindings"][mode][str(n)]
                  assert math.isfinite(s["row_max_mean"])
                  assert s["independent_argmax_collision_count"] == n - s["independent_argmax_unique_slot_count"]
          for values in (r["minimum_answer_loss"], r["minimum_total_loss"], r["final_answer_loss"], r["final_total_loss"], r["maximum_post4000_grad_norm"]):
              assert all(math.isfinite(v) and v >= 0 for v in values.values())
          print("X19 provenance contract PASS")
          PY
      - name: Upload X19 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-x19-seed-${{ matrix.seed }}
          path: casm_v01/casm-x19-output/
          if-no-files-found: error
          retention-days: 90
