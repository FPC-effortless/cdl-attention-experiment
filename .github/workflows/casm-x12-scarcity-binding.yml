name: CASM-X12 scarcity binding

on:
  push:
    branches:
      - experiment/casm-x12-scarcity-binding
    paths:
      - "casm_v01/EXPERIMENT_CASM_X12.md"
      - "casm_v01/casm/scarcity_binding.py"
      - "casm_v01/casm/run_scarcity_binding.py"
      - "casm_v01/tests/test_scarcity_binding.py"
      - ".github/workflows/casm-x12-scarcity-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Run X12 integrity tests
        run: |
          PYTHONPATH=casm_v01 pytest -q \
            casm_v01/tests/test_cardinality_valid_executor.py \
            casm_v01/tests/test_coordinated_binding.py \
            casm_v01/tests/test_resource_competitive_binding.py \
            casm_v01/tests/test_scarcity_binding.py

  train-evaluate:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 20261071
            eval_seed: 20261151
          - seed: 20261072
            eval_seed: 20261152
          - seed: 20261073
            eval_seed: 20261153
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Train and evaluate X12 scarcity regimes
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.run_scarcity_binding \
            --steps 10000 --batch-size 128 --train-depth 8 \
            --weight-decay 0.0001 --eval-n 256 --eval-batch-size 64 \
            --seed ${{ matrix.seed }} --eval-seed ${{ matrix.eval_seed }} \
            --output casm-x12-output/results-${{ matrix.seed }}.json
      - name: Validate provenance and print decisive metrics
        working-directory: casm_v01
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          path = next(Path("casm-x12-output").glob("results-*.json"))
          r = json.loads(path.read_text())
          assert r["harness_version"] == "casm-x12-scarcity-binding-v0-2026-09-01"
          assert r["steps"] == 10000 and r["batch_size"] == 128 and r["train_depth"] == 8
          assert r["eval_n"] == 256
          assert r["training_cardinalities"] == [2,3,4] and r["unseen_cardinalities"] == [5,6]
          assert r["training_cardinality_counts"] == {"2":3334,"3":3333,"4":3333}
          c = r["scarcity_contract"]
          assert c["spread_lambda"] == 1.0 and c["capacity_lambda"] == 1.0
          assert c["hard_injectivity"] is False and c["matching"] is False and c["sinkhorn"] is False
          assert c["collision_repair"] is False and c["binding_labels"] is False
          for values in (r["minimum_answer_loss"], r["minimum_total_loss"], r["final_answer_loss"], r["final_total_loss"], r["maximum_post4000_grad_norm"]):
              assert all(math.isfinite(v) and v >= 0.0 for v in values.values())
          paired = (
              ("relational_independent_overlap", "relational_independent_scarcity"),
              ("relational_coordinated_overlap", "relational_coordinated_scarcity"),
              ("relational_independent_scarcity", "relational_coordinated_scarcity"),
          )
          for a,b in paired:
              assert r["parameters"][a] == r["parameters"][b]
              assert r["trainable_parameters"][a] == r["trainable_parameters"][b]
          modes = ("canonical_functional","relational_independent_overlap","relational_coordinated_overlap","relational_independent_scarcity","relational_coordinated_scarcity")
          for n in range(2,7):
              print("n",n)
              for mode in modes[1:]:
                  s=r["final_bindings"][mode][str(n)]
                  for key in ("normalized_row_spread","slot_capacity_overflow","mean_pairwise_overlap","row_max_mean"):
                      assert math.isfinite(s[key])
                  print(mode,s["independent_argmax_assignment"],s["independent_argmax_unique_slot_count"],s["row_max_mean"],s["normalized_row_spread"],s["slot_capacity_overflow"])
              for suite in ("iid_depth_8","composition_depth_12","composition_depth_24","stress_depth_48","stress_depth_96"):
                  for mode in modes:
                      for table in (r["evaluation"],r["soft_evaluation"]):
                          m=table[str(n)][suite][mode]
                          for key in ("final_state_exact","step_state_exact","register_accuracy","answer_final_accuracy","answer_step_accuracy","hidden_register_accuracy","hidden_final_exact"):
                              assert math.isfinite(m[key])
          PY
      - name: Upload X12 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-x12-seed-${{ matrix.seed }}
          path: casm_v01/casm-x12-output/
          if-no-files-found: error
          retention-days: 90
