name: COG-DRONE original evidence audit
on:
  pull_request:
    paths:
      - 'research/cog-drone-audit/**'
      - '.github/workflows/cog-drone-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/cog-drone-audit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - run: python provenance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cog-drone-source-provenance
          path: research/cog-drone-audit/provenance-result.json
          if-no-files-found: warn
  archive-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/cog-drone-audit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - name: Require byte-exact archives
        run: python custody.py
      - name: Install CPU dependencies
        run: |
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Replay historical checkpoints
        run: |
          PYTHONDONTWRITEBYTECODE=1 python audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cog-drone-custody-and-replay
          path: |
            research/cog-drone-audit/custody-result.json
            research/cog-drone-audit/audit_results.json
          if-no-files-found: warn
