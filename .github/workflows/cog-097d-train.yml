name: COG-ATTN-097d train and frozen evaluation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/cog-097d/**'
      - '.github/workflows/cog-097d-train.yml'
permissions:
  contents: read
jobs:
  train_and_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - name: Install CPU Torch
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install other pinned dependencies
        run: python -m pip install numpy==2.3.5 scikit-learn==1.8.0 pytest==9.0.2
      - name: Source hash closure, training, frozen test and audit
        run: bash research/cog-097d/reproduce.sh
