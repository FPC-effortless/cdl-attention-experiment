name: CASM-X2 feature matched control

on:
  push:
    branches:
      - experiment/casm-x2-contextual-state
    paths:
      - "casm_v01/casm/state_access_controls.py"
      - "casm_v01/casm/run_feature_matched_control.py"
      - "casm_v01/tests/test_feature_matched_control.py"
      - "casm_v01/EXPERIMENT_CASM_X2_FEATURE_MATCH.md"
      - ".github/workflows/casm-x2-feature-matched-control.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Run feature-matched tests
        run: PYTHONPATH=casm_v01 pytest -q casm_v01/tests/test_feature_matched_control.py

  train-evaluate:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 20260871
            eval_seed: 20260951
          - seed: 20260872
            eval_seed: 20260952
          - seed: 20260873
            eval_seed: 20260953
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Train and evaluate feature-matched control
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.run_feature_matched_control \
            --steps 2400 \
            --batch-size 128 \
            --train-max-depth 4 \
            --eval-n 384 \
            --eval-batch-size 64 \
            --seed ${{ matrix.seed }} \
            --eval-seed ${{ matrix.eval_seed }} \
            --output casm-x2-feature-output/results-${{ matrix.seed }}.json
      - name: Print decisive metrics
        working-directory: casm_v01
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = next(Path("casm-x2-feature-output").glob("results-*.json"))
          report = json.loads(path.read_text())
          print("parameters", report["parameters"])
          print("ratios", report["parameter_ratio_to_explicit"])
          for name, ratio in report["parameter_ratio_to_explicit"].items():
              assert 0.95 <= ratio <= 1.05, (name, ratio)
          for suite in ("iid_depth_4", "composition_depth_6", "composition_depth_12", "stress_depth_24", "stress_depth_48", "stress_depth_96"):
              row = report["evaluation"][suite]
              print("\n", suite)
              for name in ("explicit_transition", "feature_matched_gru", "state_only_gru"):
                  print(name, row[name]["final_state_exact"], row[name]["step_state_exact"])
          PY
      - name: Upload feature-matched result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-x2-feature-seed-${{ matrix.seed }}
          path: casm_v01/casm-x2-feature-output/
          if-no-files-found: error
          retention-days: 90
