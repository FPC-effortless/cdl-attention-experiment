name: CASM-X6R normalized learned binding

on:
  push:
    branches:
      - experiment/casm-x6r-normalized-binding
    paths:
      - "casm_v01/casm/learned_binding.py"
      - "casm_v01/casm/run_learned_binding.py"
      - "casm_v01/tests/test_learned_binding.py"
      - "casm_v01/EXPERIMENT_CASM_X6R.md"
      - ".github/workflows/casm-x6r-normalized-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Run X6R probability and leakage integrity tests
        run: PYTHONPATH=casm_v01 pytest -q casm_v01/tests/test_learned_binding.py casm_v01/tests/test_fixed_answer_register.py casm_v01/tests/test_weak_supervision.py

  train-evaluate:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 20260911
            eval_seed: 20260991
          - seed: 20260912
            eval_seed: 20260992
          - seed: 20260913
            eval_seed: 20260993
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Train and evaluate binding regimes
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.run_learned_binding \
            --steps 6000 \
            --batch-size 128 \
            --train-depth 8 \
            --binding-temperature 1.0 \
            --eval-n 384 \
            --eval-batch-size 64 \
            --seed ${{ matrix.seed }} \
            --eval-seed ${{ matrix.eval_seed }} \
            --output casm-x6r-output/results-${{ matrix.seed }}.json
      - name: Validate probability contract and print metrics
        working-directory: casm_v01
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = next(Path("casm-x6r-output").glob("results-*.json"))
          report = json.loads(path.read_text())
          assert report["binding_normalizer"] == "exact_birkhoff_permutation_mixture"
          contract = report["supervision_contract"]
          assert contract["teacher_forcing"] is False
          assert contract["semantic_operator_labels"] is False
          assert contract["intermediate_state_targets"] is False
          assert contract["binding_labels"] is False
          assert contract["identity_prior"] is False
          assert contract["binding_regularizer"] is False
          assert contract["all_register_specific_access_passes_through_binding"] is True
          assert report["steps"] == 6000
          assert report["train_depth"] == 8
          assert report["binding_temperature"] == 1.0
          assert len(set(report["parameters"].values())) == 1
          assert all(math.isfinite(x) and x >= 0.0 for x in report["minimum_training_loss"].values())

          initial = report["initial_learned_binding"]
          assert initial["row_max_mean"] < 0.30, initial
          assert initial["max_row_sum_error"] <= 1e-6, initial
          assert initial["max_column_sum_error"] <= 1e-6, initial

          learned = report["final_binding_stats"]["learned_binding"]
          assert learned["max_row_sum_error"] <= 1e-6, learned
          assert learned["max_column_sum_error"] <= 1e-6, learned
          assert sorted(learned["projected_permutation"]) == [0, 1, 2, 3]
          for key in (
              "row_max_mean",
              "column_max_mean",
              "row_entropy_mean",
              "best_permutation_score",
              "max_row_sum_error",
              "max_column_sum_error",
          ):
              assert math.isfinite(learned[key]), (key, learned[key])

          print("parameters", report["parameters"])
          print("minimum_training_loss", report["minimum_training_loss"])
          print("initial_binding", initial)
          print("final_learned_binding", learned)
          for suite in (
              "iid_depth_8",
              "composition_depth_12",
              "composition_depth_24",
              "stress_depth_48",
              "stress_depth_96",
          ):
              row = report["evaluation"][suite]
              print("\n", suite)
              for mode in ("canonical_binding", "learned_binding", "diffuse_binding"):
                  metrics = row[mode]
                  for key in (
                      "final_state_exact",
                      "step_state_exact",
                      "register_accuracy",
                      "answer_final_accuracy",
                      "answer_step_accuracy",
                      "hidden_register_accuracy",
                      "hidden_final_exact",
                  ):
                      assert math.isfinite(metrics[key]), (suite, mode, key, metrics[key])
                  print(
                      mode,
                      "answer", metrics["answer_final_accuracy"],
                      "step", metrics["step_state_exact"],
                      "hidden", metrics["hidden_register_accuracy"],
                  )
          PY
      - name: Upload X6R result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-x6r-seed-${{ matrix.seed }}
          path: casm_v01/casm-x6r-output/
          if-no-files-found: error
          retention-days: 90
