name: CASM-P latent process supervision

on:
  push:
    branches:
      - experiment/casm-p-process-supervision
    paths:
      - "casm_v01/**"
      - ".github/workflows/casm-p-process-supervision.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: "20261201"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest

      - name: Assemble and test
        run: |
          cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
          PYTHONPATH=casm_v01 pytest -q \
            casm_v01/tests/test_process_supervision.py \
            casm_v01/tests/test_data_v2.py \
            casm_v01/tests/test_recurrent_reasoning.py

      - name: Process-supervision smoke train
        run: |
          PYTHONPATH=casm_v01 python -m casm.train_process \
            --tiny --steps 20 --batch-size 3 --seq-len 320 --eval-batches 1 \
            --process-start 1 --process-warmup 5 --process-weight 0.15 \
            --log-every 10 --seed 20261200 --out casm-p-smoke

      - name: Train paired final-only and process-supervised models
        run: |
          PYTHONPATH=casm_v01 python -m casm.train_process \
            --tiny \
            --steps 2000 \
            --batch-size 12 \
            --seq-len 385 \
            --eval-batches 16 \
            --log-every 100 \
            --answer-weight 12 \
            --hard-max-prob 0.5 \
            --hard-ramp-steps 800 \
            --process-start 200 \
            --process-warmup 400 \
            --process-weight 0.15 \
            --seed 20261201 \
            --out casm-p-output

      - name: Corrected heterogeneous likelihood
        run: |
          PYTHONPATH=casm_v01 python -m casm.eval_process \
            casm-p-output/final-only-3step.pt \
            casm-p-output/process-3step.pt \
            --mode task --hard --n 120 --seed 20261202 \
            > casm-p-output/task-hard.txt
          cat casm-p-output/task-hard.txt

      - name: True autoregressive task solve rate
        run: |
          PYTHONPATH=casm_v01 python -m casm.eval_process \
            casm-p-output/final-only-3step.pt \
            casm-p-output/process-3step.pt \
            --mode freegen-task --hard --n 60 --max-new-tokens 20 --seed 20261203 \
            > casm-p-output/freegen-task-hard.txt
          cat casm-p-output/freegen-task-hard.txt

      - name: Exact-balanced graph generation
        run: |
          PYTHONPATH=casm_v01 python -m casm.eval_process \
            casm-p-output/final-only-3step.pt \
            casm-p-output/process-3step.pt \
            --mode balanced-graph --n 50 --max-new-tokens 6 --seed 20261204 \
            > casm-p-output/balanced-graph.txt
          cat casm-p-output/balanced-graph.txt

      - name: Corrected long-horizon stress
        run: |
          PYTHONPATH=casm_v01 python -m casm.eval_process \
            casm-p-output/final-only-3step.pt \
            casm-p-output/process-3step.pt \
            --mode stress --n 60 --seed 20261205 \
            > casm-p-output/stress.txt
          cat casm-p-output/stress.txt

      - name: Long-horizon free generation
        run: |
          PYTHONPATH=casm_v01 python -m casm.eval_process \
            casm-p-output/final-only-3step.pt \
            casm-p-output/process-3step.pt \
            --mode freegen-stress --n 30 --max-new-tokens 20 --seed 20261206 \
            > casm-p-output/freegen-stress.txt
          cat casm-p-output/freegen-stress.txt

      - name: Preserve experiment contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path('casm-p-output/run-metadata.json').write_text(json.dumps({
            'experiment': 'CASM-P-latent-process-supervision',
            'seed': 20261201,
            'steps': 2000,
            'reasoning_steps': 3,
            'scope': 'one problem per memory lifetime',
            'state_prompt': 'explicit initial state',
            'deployed_core': 'identical CASM recurrent Q/K architecture',
            'variants': ['final-only-3step', 'process-3step'],
            'process_supervision': 'training-only deterministic verifier traces at each recurrent step',
            'primary_metric': 'true autoregressive exact solve rate',
          }, indent=2))
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-p-process-supervision-results
          path: casm-p-output/
          if-no-files-found: warn
          retention-days: 90
