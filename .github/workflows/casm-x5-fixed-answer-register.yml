name: CASM-X5 fixed answer register

on:
  push:
    branches:
      - experiment/casm-x5-fixed-answer-register
    paths:
      - "casm_v01/casm/fixed_answer_register.py"
      - "casm_v01/casm/run_fixed_answer_register.py"
      - "casm_v01/tests/test_fixed_answer_register.py"
      - "casm_v01/EXPERIMENT_CASM_X5.md"
      - ".github/workflows/casm-x5-fixed-answer-register.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Run X5 integrity tests
        run: PYTHONPATH=casm_v01 pytest -q casm_v01/tests/test_fixed_answer_register.py casm_v01/tests/test_partial_final_answer.py casm_v01/tests/test_weak_supervision.py

  train-evaluate:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 20260901
            eval_seed: 20260981
          - seed: 20260902
            eval_seed: 20260982
          - seed: 20260903
            eval_seed: 20260983
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Train and evaluate fixed-answer regimes
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.run_fixed_answer_register \
            --steps 4000 \
            --batch-size 128 \
            --train-depth 8 \
            --eval-n 384 \
            --eval-batch-size 64 \
            --seed ${{ matrix.seed }} \
            --eval-seed ${{ matrix.eval_seed }} \
            --output casm-x5-output/results-${{ matrix.seed }}.json
      - name: Validate and print decisive metrics
        working-directory: casm_v01
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          path = next(Path("casm-x5-output").glob("results-*.json"))
          report = json.loads(path.read_text())
          contract = report["supervision_contract"]
          assert contract["teacher_forcing"] is False
          assert contract["semantic_operator_labels"] is False
          assert contract["intermediate_state_targets"] is False
          assert contract["registers_1_2_3_are_never_loss_targets_in_fixed_register"] is True
          assert report["fixed_answer_register"] == 0
          assert len(set(report["parameters"].values())) == 1
          counts = report["random_query_counts"]
          total = sum(counts)
          assert all(abs(c / total - 0.25) < 0.01 for c in counts), counts
          print("parameters", report["parameters"])
          print("random_query_counts", counts)
          for suite in ("iid_depth_8", "composition_depth_12", "composition_depth_24", "stress_depth_48", "stress_depth_96"):
              row = report["evaluation"][suite]
              print("\n", suite)
              for regime in ("full_final", "random_register", "fixed_register"):
                  metrics = row[regime]
                  for key in (
                      "final_state_exact",
                      "step_state_exact",
                      "register_accuracy",
                      "answer_final_accuracy",
                      "answer_step_accuracy",
                      "hidden_register_accuracy",
                      "hidden_final_exact",
                  ):
                      assert math.isfinite(metrics[key]), (suite, regime, key, metrics[key])
                  print(
                      regime,
                      "full_final", metrics["final_state_exact"],
                      "step", metrics["step_state_exact"],
                      "answer", metrics["answer_final_accuracy"],
                      "hidden_reg", metrics["hidden_register_accuracy"],
                      "hidden_final", metrics["hidden_final_exact"],
                  )
          PY
      - name: Upload X5 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-x5-seed-${{ matrix.seed }}
          path: casm_v01/casm-x5-output/
          if-no-files-found: error
          retention-days: 90
