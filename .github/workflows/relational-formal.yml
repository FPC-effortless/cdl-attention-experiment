name: Relational formal contract audit
on:
  pull_request:
    paths:
      - 'formal/relational/**'
      - 'tools/audit_lean_contracts.py'
      - 'tools/audit_math_contracts.py'
      - '.github/workflows/relational-formal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean
        run: |
          curl -fL --retry 2 https://github.com/leanprover/lean4/releases/download/v4.15.0/lean-4.15.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          tar --no-same-owner --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.15.0-linux/bin" >> "$GITHUB_PATH"
      - name: Baseline, axiom audit and semantic mutations
        run: python tools/audit_lean_contracts.py --output formal-audit.json
      - name: Mathematical and bounded-index fixtures
        run: python tools/audit_math_contracts.py math-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relational-formal-audit
          path: |
            formal-audit.json
            math-audit.json
