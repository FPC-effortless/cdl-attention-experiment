name: CASM v0.1 compression-QK multi-seed

on:
  push:
    branches:
      - experiment/casm-v01-compression-qk-multiseed
    paths:
      - ".github/workflows/casm-v01-compression-qk-multiseed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replicate:
    strategy:
      fail-fast: false
      matrix:
        seed: [20260921, 20260922, 20260923]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Assemble and test
        run: |
          cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
          PYTHONPATH=casm_v01 pytest -q casm_v01/tests
      - name: Train paired variants
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.train \
            --tiny \
            --steps 800 \
            --batch-size 8 \
            --seq-len 193 \
            --eval-batches 20 \
            --log-every 200 \
            --compression-warmup 125 \
            --gzip-teacher-decay 650 \
            --gzip-teacher-floor 0.35 \
            --answer-weight 8 \
            --hard-max-prob 0.5 \
            --hard-ramp-steps 500 \
            --seed ${{ matrix.seed }} \
            --models qk-memory,compression-qk,compression \
            --out casm-output
      - name: Heterogeneous task evaluation
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.eval_tasks \
            casm-output/qk-memory.pt \
            casm-output/compression-qk.pt \
            casm-output/compression.pt \
            --n-per-task 80 \
            --seed $(( ${{ matrix.seed }} + 100000 )) \
            > casm-output/task-eval.txt
          cat casm-output/summary.csv
      - name: Preserve seed metadata
        working-directory: casm_v01
        run: |
          printf '{"seed": %s, "models": ["qk-memory", "compression-qk", "compression"], "steps": 800}\n' '${{ matrix.seed }}' > casm-output/replication-metadata.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-v01-compression-qk-seed-${{ matrix.seed }}
          path: casm_v01/casm-output/
          if-no-files-found: warn
          retention-days: 90
