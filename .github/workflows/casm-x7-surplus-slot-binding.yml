name: CASM-X7 surplus-slot sparse binding

on:
  push:
    branches:
      - experiment/casm-x7-surplus-slot-binding
    paths:
      - "casm_v01/casm/surplus_slot_binding.py"
      - "casm_v01/casm/run_surplus_slot_binding.py"
      - "casm_v01/tests/test_surplus_slot_binding.py"
      - "casm_v01/EXPERIMENT_CASM_X7.md"
      - ".github/workflows/casm-x7-surplus-slot-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Run X7 surplus-slot integrity tests
        run: PYTHONPATH=casm_v01 pytest -q casm_v01/tests/test_surplus_slot_binding.py casm_v01/tests/test_fixed_answer_register.py casm_v01/tests/test_weak_supervision.py

  train-evaluate:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 20261001
            eval_seed: 20261081
          - seed: 20261002
            eval_seed: 20261082
          - seed: 20261003
            eval_seed: 20261083
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Train and evaluate surplus-slot regimes
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.run_surplus_slot_binding \
            --steps 8000 \
            --batch-size 128 \
            --train-depth 8 \
            --binding-temperature 1.0 \
            --eval-n 384 \
            --eval-batch-size 64 \
            --seed ${{ matrix.seed }} \
            --eval-seed ${{ matrix.eval_seed }} \
            --output casm-x7-output/results-${{ matrix.seed }}.json
      - name: Validate contract and print decisive metrics
        working-directory: casm_v01
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = next(Path("casm-x7-output").glob("results-*.json"))
          report = json.loads(path.read_text())
          contract = report["supervision_contract"]
          assert report["steps"] == 8000
          assert report["train_depth"] == 8
          assert report["binding_temperature"] == 1.0
          assert contract["teacher_forcing"] is False
          assert contract["semantic_operator_labels"] is False
          assert contract["intermediate_state_targets"] is False
          assert contract["binding_labels"] is False
          assert contract["canonical_slot_prior_for_learned_mode"] is False
          assert contract["binding_regularizer"] is False
          assert contract["external_register_count"] == 4
          assert contract["candidate_internal_slot_count"] == 8
          assert contract["surplus_symbol"] == "EMPTY"
          assert contract["injective_assignment_prior"] is True
          assert contract["all_register_specific_access_passes_through_binding"] is True
          assert len(set(report["parameters"].values())) == 1
          assert all(math.isfinite(v) and v >= 0.0 for v in report["minimum_training_loss"].values())

          initial = report["initial_learned_binding"]
          assert initial["row_max_mean"] < 0.15, initial
          assert initial["max_row_sum_error"] <= 1e-6, initial
          assert initial["max_column_occupancy"] <= 1.0 + 1e-6, initial
          assert abs(initial["total_assignment_mass"] - 4.0) <= 1e-6, initial

          learned = report["final_binding_stats"]["learned_sparse"]
          assert learned["max_row_sum_error"] <= 1e-6, learned
          assert learned["max_column_occupancy"] <= 1.0 + 1e-6, learned
          assert abs(learned["total_assignment_mass"] - 4.0) <= 1e-6, learned
          assert learned["selected_slot_count"] == 4, learned
          assert len(set(learned["projected_assignment"])) == 4, learned
          for key in ("row_max_mean", "row_entropy_mean", "best_assignment_score"):
              assert math.isfinite(learned[key]), (key, learned[key])

          print("parameters", report["parameters"])
          print("minimum_training_loss", report["minimum_training_loss"])
          print("initial_binding", initial)
          print("final_learned_binding", learned)
          for suite in (
              "iid_depth_8",
              "composition_depth_12",
              "composition_depth_24",
              "stress_depth_48",
              "stress_depth_96",
          ):
              row = report["evaluation"][suite]
              print("\n", suite)
              for mode in ("canonical_sparse", "learned_sparse", "diffuse_surplus"):
                  metrics = row[mode]
                  for key in (
                      "final_state_exact",
                      "step_state_exact",
                      "register_accuracy",
                      "answer_final_accuracy",
                      "answer_step_accuracy",
                      "hidden_register_accuracy",
                      "hidden_final_exact",
                  ):
                      assert math.isfinite(metrics[key]), (suite, mode, key, metrics[key])
                  print(
                      mode,
                      "answer", metrics["answer_final_accuracy"],
                      "step", metrics["step_state_exact"],
                      "hidden", metrics["hidden_register_accuracy"],
                  )
          PY
      - name: Upload X7 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-x7-seed-${{ matrix.seed }}
          path: casm_v01/casm-x7-output/
          if-no-files-found: error
          retention-days: 90
