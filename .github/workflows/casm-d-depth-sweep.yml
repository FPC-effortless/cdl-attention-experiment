name: CASM-D recurrence-depth diagnostic

on:
  push:
    branches:
      - diagnostic/casm-d-depth-sweep
    paths:
      - "casm_v01/**"
      - ".github/workflows/casm-d-depth-sweep.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Assemble
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Download completed pilot checkpoint
        run: |
          mkdir -p pilot-artifact
          gh run download 33282028738 \
            -R FPC-effortless/cdl-attention-experiment \
            -n casm-d-pilot-results \
            -D pilot-artifact
          ls -lah pilot-artifact
      - name: Evaluate depths 1 2 3 5
        run: |
          PYTHONPATH=casm_v01 python -m casm.eval_process_depths \
            pilot-artifact/deep-answer-3step.pt \
            --depths 1,2,3,5 --n-likelihood 40 --n-freegen 20 --seed 20261229 \
            > depth-sweep.txt
          cat depth-sweep.txt
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-d-depth-sweep-results
          path: depth-sweep.txt
          retention-days: 30
