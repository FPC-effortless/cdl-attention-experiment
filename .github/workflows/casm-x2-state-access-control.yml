name: CASM-X2 equal state access

on:
  push:
    branches:
      - experiment/casm-x2-contextual-state
    paths:
      - "casm_v01/casm/state_access_controls.py"
      - "casm_v01/casm/run_state_access_control.py"
      - "casm_v01/tests/test_state_access_control.py"
      - "casm_v01/EXPERIMENT_CASM_X2_STATE_ACCESS.md"
      - ".github/workflows/casm-x2-state-access-control.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Assemble CASM package model
        run: |
          cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Run equal-state-access tests
        run: |
          PYTHONPATH=casm_v01 pytest -q casm_v01/tests/test_state_access_control.py

  train-evaluate:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 20260861
            eval_seed: 20260941
          - seed: 20260862
            eval_seed: 20260942
          - seed: 20260863
            eval_seed: 20260943
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Assemble CASM package model
        run: |
          cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Train and evaluate equal-state-access control
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.run_state_access_control \
            --steps 2400 \
            --batch-size 128 \
            --train-max-depth 4 \
            --eval-n 384 \
            --eval-batch-size 64 \
            --seed ${{ matrix.seed }} \
            --eval-seed ${{ matrix.eval_seed }} \
            --output casm-x2-state-access-output/results-${{ matrix.seed }}.json
      - name: Check parameter match and print metrics
        working-directory: casm_v01
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = next(Path("casm-x2-state-access-output").glob("results-*.json"))
          report = json.loads(path.read_text())
          print("parameters", report["parameters"])
          print("ratios", report["parameter_ratio_to_explicit"])
          for name, ratio in report["parameter_ratio_to_explicit"].items():
              assert 0.95 <= ratio <= 1.05, (name, ratio)
          for suite in (
              "iid_depth_4",
              "composition_depth_6",
              "composition_depth_12",
              "stress_depth_24",
              "stress_depth_48",
              "stress_depth_96",
          ):
              row = report["evaluation"][suite]
              print("\n", suite)
              for name in ("explicit_transition", "state_access_gru", "hidden_only_gru"):
                  print(name, row[name]["final_state_exact"], row[name]["step_state_exact"])
          PY
      - name: Upload equal-state-access result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-x2-state-access-seed-${{ matrix.seed }}
          path: casm_v01/casm-x2-state-access-output/
          if-no-files-found: error
          retention-days: 90
