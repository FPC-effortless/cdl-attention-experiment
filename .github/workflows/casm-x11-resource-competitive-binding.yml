name: CASM-X11 resource-competitive binding

on:
  push:
    branches:
      - experiment/casm-x11-resource-competitive-binding
    paths:
      - "casm_v01/EXPERIMENT_CASM_X11.md"
      - "casm_v01/casm/resource_competitive_binding.py"
      - "casm_v01/casm/run_resource_competitive_binding.py"
      - "casm_v01/tests/test_resource_competitive_binding.py"
      - ".github/workflows/casm-x11-resource-competitive-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Run X11 integrity tests
        run: |
          PYTHONPATH=casm_v01 pytest -q \
            casm_v01/tests/test_cardinality_valid_executor.py \
            casm_v01/tests/test_coordinated_binding.py \
            casm_v01/tests/test_resource_competitive_binding.py

  train-evaluate:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 20261061
            eval_seed: 20261141
          - seed: 20261062
            eval_seed: 20261142
          - seed: 20261063
            eval_seed: 20261143
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Train and evaluate X11 competition regimes
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.run_resource_competitive_binding \
            --steps 10000 \
            --batch-size 128 \
            --train-depth 8 \
            --weight-decay 0.0001 \
            --eval-n 256 \
            --eval-batch-size 64 \
            --seed ${{ matrix.seed }} \
            --eval-seed ${{ matrix.eval_seed }} \
            --output casm-x11-output/results-${{ matrix.seed }}.json
      - name: Validate provenance and print decisive metrics
        working-directory: casm_v01
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = next(Path("casm-x11-output").glob("results-*.json"))
          report = json.loads(path.read_text())
          assert report["harness_version"] == "casm-x11-resource-competitive-binding-v0-2026-08-31"
          assert report["steps"] == 10000
          assert report["batch_size"] == 128
          assert report["train_depth"] == 8
          assert report["eval_n"] == 256
          assert report["training_cardinalities"] == [2,3,4]
          assert report["unseen_cardinalities"] == [5,6]
          assert report["training_cardinality_counts"] == {"2":3334,"3":3333,"4":3333}
          assert report["competition_contract"]["lambda"] == 1.0
          assert report["competition_contract"]["binding_labels"] is False
          assert report["competition_contract"]["matching"] is False
          assert report["competition_contract"]["hard_injectivity"] is False
          assert report["competition_contract"]["collision_repair"] is False
          assert report["supervision_contract"]["teacher_forcing"] is False
          assert report["supervision_contract"]["intermediate_state_targets"] is False
          assert report["supervision_contract"]["hidden_final_targets"] is False
          assert report["supervision_contract"]["binding_labels"] is False

          paired = (
              ("relational_independent_no_competition", "relational_independent_competitive"),
              ("relational_coordinated_no_competition", "relational_coordinated_competitive"),
              ("relational_independent_competitive", "relational_coordinated_competitive"),
          )
          for left, right in paired:
              assert report["parameters"][left] == report["parameters"][right]
              assert report["trainable_parameters"][left] == report["trainable_parameters"][right]

          for values in (
              report["minimum_answer_loss"],
              report["minimum_total_loss"],
              report["final_answer_loss"],
              report["final_total_loss"],
              report["maximum_post4000_grad_norm"],
          ):
              assert all(math.isfinite(v) and v >= 0.0 for v in values.values())

          modes = (
              "canonical_functional",
              "relational_independent_no_competition",
              "relational_coordinated_no_competition",
              "relational_independent_competitive",
              "relational_coordinated_competitive",
          )
          for n in range(2, 7):
              print("\nn", n)
              for learned in modes[1:]:
                  stats = report["final_bindings"][learned][str(n)]
                  assert math.isfinite(stats["mean_pairwise_overlap"])
                  print(
                      learned,
                      "assignment", stats["independent_argmax_assignment"],
                      "unique", stats["independent_argmax_unique_slot_count"],
                      "collisions", stats["independent_argmax_collision_count"],
                      "row_max", stats["row_max_mean"],
                      "overlap", stats["mean_pairwise_overlap"],
                  )
              for suite in (
                  "iid_depth_8",
                  "composition_depth_12",
                  "composition_depth_24",
                  "stress_depth_48",
                  "stress_depth_96",
              ):
                  row = report["evaluation"][str(n)][suite]
                  soft = report["soft_evaluation"][str(n)][suite]
                  print(suite)
                  for mode in modes:
                      hard_metrics = row[mode]
                      soft_metrics = soft[mode]
                      for metrics in (hard_metrics, soft_metrics):
                          for key in (
                              "final_state_exact",
                              "step_state_exact",
                              "register_accuracy",
                              "answer_final_accuracy",
                              "answer_step_accuracy",
                              "hidden_register_accuracy",
                              "hidden_final_exact",
                          ):
                              assert math.isfinite(metrics[key]), (n, suite, mode, key, metrics[key])
                      print(
                          mode,
                          "hard_answer", hard_metrics["answer_final_accuracy"],
                          "hard_step", hard_metrics["step_state_exact"],
                          "hard_hidden", hard_metrics["hidden_register_accuracy"],
                          "soft_answer", soft_metrics["answer_final_accuracy"],
                      )
          PY
      - name: Upload X11 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-x11-seed-${{ matrix.seed }}
          path: casm_v01/casm-x11-output/
          if-no-files-found: error
          retention-days: 90
