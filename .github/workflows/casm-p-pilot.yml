name: CASM-P directional pilot

on:
  push:
    branches:
      - experiment/casm-p-process-supervision
    paths:
      - ".github/workflows/casm-p-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Assemble
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Train 600-step pilot
        run: |
          PYTHONPATH=casm_v01 python -m casm.train_process \
            --tiny --steps 600 --batch-size 8 --seq-len 385 --eval-batches 6 \
            --answer-weight 12 --hard-max-prob 0.5 --hard-ramp-steps 300 \
            --process-start 80 --process-warmup 160 --process-weight 0.15 \
            --log-every 100 --seed 20261211 --out casm-p-pilot
      - name: Hard task likelihood
        run: |
          PYTHONPATH=casm_v01 python -m casm.eval_process \
            casm-p-pilot/final-only-3step.pt casm-p-pilot/process-3step.pt \
            --mode task --hard --n 50 --seed 20261212 > casm-p-pilot/task-hard.txt
          cat casm-p-pilot/task-hard.txt
      - name: Hard task free generation
        run: |
          PYTHONPATH=casm_v01 python -m casm.eval_process \
            casm-p-pilot/final-only-3step.pt casm-p-pilot/process-3step.pt \
            --mode freegen-task --hard --n 30 --max-new-tokens 20 --seed 20261213 > casm-p-pilot/freegen.txt
          cat casm-p-pilot/freegen.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: casm-p-pilot-results
          path: casm-p-pilot/
          retention-days: 30
