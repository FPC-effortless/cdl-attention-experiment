name: CASM-D direct deep answer supervision

on:
  push:
    branches:
      - experiment/casm-d-deep-answer
    paths:
      - "casm_v01/**"
      - ".github/workflows/casm-d-deep-answer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: "20261221"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest

      - name: Assemble and test
        run: |
          cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
          PYTHONPATH=casm_v01 pytest -q \
            casm_v01/tests/test_deep_answer.py \
            casm_v01/tests/test_process_supervision.py \
            casm_v01/tests/test_data_v2.py \
            casm_v01/tests/test_recurrent_reasoning.py

      - name: Deep-supervision smoke train
        run: |
          PYTHONPATH=casm_v01 python -m casm.train_deep_answer \
            --tiny --steps 20 --batch-size 3 --seq-len 320 --eval-batches 1 \
            --deep-start 1 --deep-warmup 5 --deep-weight 0.35 \
            --log-every 10 --seed 20261220 --out casm-d-smoke

      - name: Train paired final-only and deep-supervised models
        run: |
          PYTHONPATH=casm_v01 python -m casm.train_deep_answer \
            --tiny \
            --steps 2000 \
            --batch-size 12 \
            --seq-len 385 \
            --eval-batches 16 \
            --log-every 100 \
            --answer-weight 12 \
            --hard-max-prob 0.5 \
            --hard-ramp-steps 800 \
            --deep-start 200 \
            --deep-warmup 400 \
            --deep-weight 0.35 \
            --seed 20261221 \
            --out casm-d-output

      - name: Corrected heterogeneous likelihood
        run: |
          PYTHONPATH=casm_v01 python -m casm.eval_process \
            casm-d-output/final-only-3step.pt \
            casm-d-output/deep-answer-3step.pt \
            --mode task --hard --n 120 --seed 20261222 \
            > casm-d-output/task-hard.txt
          cat casm-d-output/task-hard.txt

      - name: True autoregressive task solve rate
        run: |
          PYTHONPATH=casm_v01 python -m casm.eval_process \
            casm-d-output/final-only-3step.pt \
            casm-d-output/deep-answer-3step.pt \
            --mode freegen-task --hard --n 60 --max-new-tokens 20 --seed 20261223 \
            > casm-d-output/freegen-task-hard.txt
          cat casm-d-output/freegen-task-hard.txt

      - name: Exact-balanced graph generation
        run: |
          PYTHONPATH=casm_v01 python -m casm.eval_process \
            casm-d-output/final-only-3step.pt \
            casm-d-output/deep-answer-3step.pt \
            --mode balanced-graph --n 50 --max-new-tokens 6 --seed 20261224 \
            > casm-d-output/balanced-graph.txt
          cat casm-d-output/balanced-graph.txt

      - name: Corrected long-horizon stress
        run: |
          PYTHONPATH=casm_v01 python -m casm.eval_process \
            casm-d-output/final-only-3step.pt \
            casm-d-output/deep-answer-3step.pt \
            --mode stress --n 60 --seed 20261225 \
            > casm-d-output/stress.txt
          cat casm-d-output/stress.txt

      - name: Long-horizon free generation
        run: |
          PYTHONPATH=casm_v01 python -m casm.eval_process \
            casm-d-output/final-only-3step.pt \
            casm-d-output/deep-answer-3step.pt \
            --mode freegen-stress --n 30 --max-new-tokens 20 --seed 20261226 \
            > casm-d-output/freegen-stress.txt
          cat casm-d-output/freegen-stress.txt

      - name: Preserve experiment contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path('casm-d-output/run-metadata.json').write_text(json.dumps({
            'experiment': 'CASM-D-direct-deep-answer-supervision',
            'seed': 20261221,
            'steps': 2000,
            'reasoning_steps': 3,
            'scope': 'one verifier-complete problem per memory lifetime',
            'deployed_core': 'identical 1.347M-parameter recurrent Q/K architecture',
            'variants': ['final-only-3step', 'deep-answer-3step'],
            'treatment': 'LM-head cross entropy on answer bytes after recurrent steps 1 and 2; ordinary LM loss on final step',
            'training_extra_parameters': 0,
            'primary_metric': 'true autoregressive exact solve rate',
            'acceptance': 'must improve generated exact solves; NLL-only gain is insufficient',
          }, indent=2))
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-d-deep-answer-results
          path: casm-d-output/
          if-no-files-found: warn
          retention-days: 90
