name: CASM v0.1 compression-trained QK

on:
  push:
    branches:
      - experiment/casm-v01-compression-qk
    paths:
      - ".github/workflows/casm-v01-compression-qk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Assemble and test
        run: |
          cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
          PYTHONPATH=casm_v01 pytest -q casm_v01/tests
      - name: Train paired variants
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.train \
            --tiny \
            --steps 800 \
            --batch-size 8 \
            --seq-len 193 \
            --eval-batches 20 \
            --log-every 100 \
            --compression-warmup 125 \
            --gzip-teacher-decay 650 \
            --gzip-teacher-floor 0.35 \
            --answer-weight 8 \
            --hard-max-prob 0.5 \
            --hard-ramp-steps 500 \
            --seed 20260901 \
            --models qk-memory,compression-qk,compression \
            --out casm-output
      - name: Task evaluation
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.eval_tasks \
            casm-output/qk-memory.pt \
            casm-output/compression-qk.pt \
            casm-output/compression.pt \
            --n-per-task 80 \
            --seed 20260902 \
            > casm-output/task-eval.txt
          cat casm-output/summary.csv
      - name: Runtime benchmark
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python - <<'PY'
          import csv, statistics, time, torch
          from casm.eval_tasks import load_model
          from casm.data import make_batch
          torch.set_num_threads(4)
          x,_=make_batch(8,193,999,hard=True)
          rows=[]
          for name in ["qk-memory","compression-qk","compression"]:
              m=load_model(f"casm-output/{name}.pt")
              with torch.inference_mode():
                  for _ in range(5): m(x,return_aux=False)
                  ts=[]
                  for _ in range(30):
                      t=time.perf_counter(); m(x,return_aux=False); ts.append(time.perf_counter()-t)
              rows.append({"model":name,"mean_ms":1000*statistics.mean(ts),"median_ms":1000*statistics.median(ts),"tokens_per_second":8*192/statistics.mean(ts)})
          with open("casm-output/runtime.csv","w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=rows[0].keys()); w.writeheader(); w.writerows(rows)
          print(rows)
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-v01-compression-qk-results
          path: casm_v01/casm-output/
          if-no-files-found: warn
          retention-days: 90
