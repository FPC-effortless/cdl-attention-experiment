name: CASM-X18 global coordinate descriptor

on:
  push:
    branches:
      - experiment/casm-x18-global-coordinate-descriptor
    paths:
      - "casm_v01/EXPERIMENT_CASM_X18.md"
      - "casm_v01/casm/global_coordinate_binding.py"
      - "casm_v01/casm/run_global_coordinate_binding.py"
      - "casm_v01/tests/test_global_coordinate_binding.py"
      - ".github/workflows/casm-x18-global-coordinate-descriptor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Run X18 integrity tests
        run: |
          PYTHONPATH=casm_v01 pytest -q \
            casm_v01/tests/test_cardinality_valid_executor.py \
            casm_v01/tests/test_coordinated_binding.py \
            casm_v01/tests/test_collision_barrier_binding.py \
            casm_v01/tests/test_primal_dual_capacity_binding.py \
            casm_v01/tests/test_global_coordinate_binding.py

  train-evaluate:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 20261131
            eval_seed: 20261211
          - seed: 20261132
            eval_seed: 20261212
          - seed: 20261133
            eval_seed: 20261213
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Train and evaluate X18 descriptor regimes
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.run_global_coordinate_binding \
            --steps 10000 \
            --batch-size 128 \
            --train-depth 8 \
            --weight-decay 0.0001 \
            --eval-n 256 \
            --eval-batch-size 64 \
            --seed ${{ matrix.seed }} \
            --eval-seed ${{ matrix.eval_seed }} \
            --output casm-x18-output/results-${{ matrix.seed }}.json
      - name: Validate provenance and contracts
        working-directory: casm_v01
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          path = next(Path("casm-x18-output").glob("results-*.json"))
          r = json.loads(path.read_text())
          assert r["harness_version"] == "casm-x18-global-coordinate-descriptor-v0-2026-09-04"
          assert r["steps"] == 10000 and r["batch_size"] == 128 and r["train_depth"] == 8 and r["eval_n"] == 256
          assert r["training_cardinalities"] == [2,3,4]
          assert r["unseen_cardinalities"] == [5,6]
          assert r["training_cardinality_counts"] == {"2":3334,"3":3333,"4":3333}
          assert r["descriptor_contract"]["dimension"] == 9
          assert r["descriptor_contract"]["candidate_workspace_size"] == 8
          assert r["descriptor_contract"]["global_is_cardinality_invariant"] is True
          assert r["descriptor_contract"]["correct_slot_information"] is False
          assert r["dual_contract"]["rounds"] == 8 and r["dual_contract"]["eta"] == 1.0
          assert r["dual_contract"]["matching"] is False
          assert r["dual_contract"]["collision_repair"] is False
          assert r["supervision_contract"]["pretraining_unseen_forward"] is False
          assert set(r["initial_bindings_train_cardinalities_only"]["relative_descriptor"]) == {"2","3","4"}
          assert set(r["initial_bindings_train_cardinalities_only"]["global_descriptor"]) == {"2","3","4"}
          assert r["parameters"]["relative_descriptor"] == r["parameters"]["global_descriptor"]
          assert r["trainable_parameters"]["relative_descriptor"] == r["trainable_parameters"]["global_descriptor"]
          for values in (r["minimum_answer_loss"], r["minimum_total_loss"], r["final_answer_loss"], r["final_total_loss"], r["maximum_post4000_grad_norm"], r["maximum_training_dual_price"]):
              assert all(math.isfinite(v) and v >= 0 for v in values.values())
          for mode in ("relative_descriptor", "global_descriptor"):
              for n in range(2,7):
                  s = r["final_bindings"][mode][str(n)]
                  assert math.isfinite(s["row_max_mean"])
                  assert s["independent_argmax_collision_count"] == n - s["independent_argmax_unique_slot_count"]
          print("X18 provenance contract PASS")
          PY
      - name: Upload X18 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-x18-seed-${{ matrix.seed }}
          path: casm_v01/casm-x18-output/
          if-no-files-found: error
          retention-days: 90
