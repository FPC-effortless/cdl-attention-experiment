name: LRR-006 Explicit Energy Selective Answering

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lrr-006.yml"
      - "relational_router/lrr006_energy.py"
      - "relational_router/run_lrr006.py"
      - "relational_router/test_lrr006.py"
      - "relational_router/EXPERIMENT_LRR006.md"

permissions:
  contents: read
  actions: read

jobs:
  frozen-router-energy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Minimal CPU-only research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'pytest>=8,<9' numpy
      - name: Compile and integrity tests
        run: |
          python -m compileall -q relational_router
          python -m pytest -q relational_router/test_lrr006.py
      - name: Download immutable LRR-005 checkpoint artifact from verified run
        uses: actions/download-artifact@v4
        with:
          name: lrr-005-five-seed-register-credit
          run-id: 42139011066
          repository: FPC-effortless/cdl-attention-experiment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/lrr006-frozen
      - name: Run five frozen router seeds with explicitly trained energy heads
        run: |
          python -m relational_router.run_lrr006 \
            --checkpoint-dir /tmp/lrr006-frozen/lrr005-weights \
            --seeds 41,42,43,44,45 \
            --lengths 7,32,128 \
            --train-docs 256 --dev-docs 128 --test-docs 64 \
            --steps 600 \
            --output /tmp/lrr006-results.json \
            --head-dir /tmp/lrr006-heads
      - name: Preserve unfiltered results and energy checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lrr-006-energy-head-five-seed-results
          path: |
            /tmp/lrr006-results.json
            /tmp/lrr006-heads/*.pt
          if-no-files-found: warn
