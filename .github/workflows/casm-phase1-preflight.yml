name: CASM Phase 1 preflight

on:
  push:
    branches: [main, 'feat/casm-phase1-dag-falsification']
  pull_request:
    paths:
      - 'casm_v01/phase1_dag/**'
      - 'casm_v01/tests/test_phase1_dag.py'
      - '.github/workflows/casm-phase1-preflight.yml'

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic seed-suite preflight
        run: python -m casm_v01.phase1_dag.preflight_report
