name: LRR-003B Persistent Causal Cache

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lrr-003b.yml"

jobs:
  cached-query:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install "pytest>=8,<9" numpy
      - name: Verify causal equivalence and immutable query state
        run: |
          python -m compileall -q relational_router
          python -m pytest -q relational_router/test_stream_cache.py
      - name: Measure frozen 700-step model across four history sizes
        run: python -m relational_router.run_stream_cache --output /tmp/lrr003b.json
      - name: Preserve complete state-cost observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lrr-003b-stateful-query-benchmark
          path: /tmp/lrr003b.json
          if-no-files-found: warn
