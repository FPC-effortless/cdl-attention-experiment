name: CASM-X20R straight-through state instantiation

on:
  push:
    branches:
      - experiment/casm-x20r-straight-through-instantiation
    paths:
      - "casm_v01/EXPERIMENT_CASM_X20R.md"
      - "casm_v01/casm/state_instantiation_st.py"
      - "casm_v01/casm/run_state_instantiation_st.py"
      - "casm_v01/tests/test_state_instantiation_st.py"
      - ".github/workflows/casm-x20r-straight-through-instantiation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen X20 base and preregistration ordering
        run: |
          git merge-base --is-ancestor 3225172c78ca44ad57a26d64b13ae24f122b96bb HEAD
          git merge-base --is-ancestor 5ee4b29e79e0acba91a0324adecdc800b95ca05a HEAD
          git diff --exit-code 3225172c78ca44ad57a26d64b13ae24f122b96bb -- \
            casm_v01/casm/state_instantiation_data.py \
            casm_v01/casm/state_instantiation_model.py \
            casm_v01/casm/run_state_instantiation.py \
            casm_v01/tests/test_state_instantiation.py
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Run X20 and X20R integrity tests
        run: |
          PYTHONPATH=casm_v01 pytest -q \
            casm_v01/tests/test_cardinality_valid_executor.py \
            casm_v01/tests/test_state_instantiation.py \
            casm_v01/tests/test_state_instantiation_st.py

  train-evaluate:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 20261181
            eval_seed: 20261261
          - seed: 20261182
            eval_seed: 20261262
          - seed: 20261183
            eval_seed: 20261263
          - seed: 20261184
            eval_seed: 20261264
          - seed: 20261185
            eval_seed: 20261265
          - seed: 20261186
            eval_seed: 20261266
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Train and evaluate X20R paired state constructors
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.run_state_instantiation_st \
            --steps 12000 \
            --batch-size 128 \
            --train-depth 12 \
            --eval-n 256 \
            --eval-batch-size 64 \
            --seed ${{ matrix.seed }} \
            --eval-seed ${{ matrix.eval_seed }} \
            --output casm-x20r-output/results-${{ matrix.seed }}.json
      - name: Validate X20R provenance contract
        working-directory: casm_v01
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          p = next(Path("casm-x20r-output").glob("results-*.json"))
          r = json.loads(p.read_text())
          assert r["harness_version"] == "casm-x20r-straight-through-instantiation-v0-2026-09-04"
          assert r["steps"] == 12000 and r["batch_size"] == 128 and r["train_depth"] == 12 and r["eval_n"] == 256
          assert r["candidate_count"] == 8
          assert r["training_live_cardinalities"] == [2,3,4]
          assert r["unseen_live_cardinalities"] == [5,6]
          assert r["training_cardinality_counts"] == {"2":4000,"3":4000,"4":4000}
          learned = ("soft_x20_replication", "straight_through_instantiation", "straight_through_structure_blind")
          assert len({r["parameters"][m] for m in learned}) == 1
          assert len({r["trainable_parameters"][m] for m in learned}) == 1
          c = r["constructor_contract"]
          assert c["learned_live_mask_input"] is False
          assert c["learned_active_cardinality_input"] is False
          assert c["per_candidate_parameter_table"] is False
          assert c["hard_gate_threshold"] == 0.5
          assert c["storage_lambda"] == 0.05
          assert c["straight_through_forward_binary"] is True
          assert c["straight_through_storage_uses_forward_hard_fraction"] is True
          assert r["supervision_contract"]["live_mask_loss"] is False
          assert r["supervision_contract"]["cardinality_loss"] is False
          assert r["supervision_contract"]["pretraining_unseen_live_cardinality"] is False
          for mode in learned:
              assert set(r["initial_gate_stats_train_cardinalities_only"][mode]) == {"2","3","4"}
          for values in (r["minimum_answer_loss"], r["final_answer_loss"], r["maximum_post4000_grad_norm"]):
              assert all(math.isfinite(v) and v >= 0 for v in values.values())
          print("X20R provenance contract PASS")
          PY
      - name: Upload X20R result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-x20r-seed-${{ matrix.seed }}
          path: casm_v01/casm-x20r-output/
          if-no-files-found: error
          retention-days: 90
