name: CASM-X19D noncontractive role dynamics

on:
  push:
    branches:
      - experiment/casm-x19d-noncontractive-role-dynamics
    paths:
      - "casm_v01/EXPERIMENT_CASM_X19D.md"
      - "casm_v01/EXPERIMENT_CASM_X19D_PREREG_ADDENDUM.md"
      - "casm_v01/casm/noncontractive_role_dynamics.py"
      - "casm_v01/casm/run_noncontractive_role_dynamics.py"
      - "casm_v01/tests/test_noncontractive_role_dynamics.py"
      - ".github/workflows/casm-x19d-noncontractive-role-dynamics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Run X19D integrity tests
        run: |
          PYTHONPATH=casm_v01 pytest -q \
            casm_v01/tests/test_cardinality_valid_executor.py \
            casm_v01/tests/test_noncontractive_role_dynamics.py

  train-evaluate:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 20261161
            eval_seed: 20261241
          - seed: 20261162
            eval_seed: 20261242
          - seed: 20261163
            eval_seed: 20261243
          - seed: 20261164
            eval_seed: 20261244
          - seed: 20261165
            eval_seed: 20261245
          - seed: 20261166
            eval_seed: 20261246
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Train and evaluate X19D role dynamics
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.run_noncontractive_role_dynamics \
            --steps 10000 \
            --batch-size 128 \
            --train-depth 8 \
            --weight-decay 0.0001 \
            --eval-n 256 \
            --eval-batch-size 64 \
            --seed ${{ matrix.seed }} \
            --eval-seed ${{ matrix.eval_seed }} \
            --output casm-x19d-output/results-${{ matrix.seed }}.json
      - name: Validate provenance and contracts
        working-directory: casm_v01
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          path = next(Path("casm-x19d-output").glob("results-*.json"))
          r = json.loads(path.read_text())
          assert r["harness_version"] == "casm-x19d-noncontractive-role-dynamics-v0-2026-09-04"
          assert r["steps"] == 10000 and r["batch_size"] == 128 and r["train_depth"] == 8 and r["eval_n"] == 256
          assert r["training_cardinalities"] == [2,3,4]
          assert r["unseen_cardinalities"] == [5,6]
          assert r["training_cardinality_counts"] == {"2":3334,"3":3333,"4":3333}
          assert r["parameters"]["unconstrained_recursive"] == r["parameters"]["orthogonal_recursive"]
          assert r["trainable_parameters"]["unconstrained_recursive"] == r["trainable_parameters"]["orthogonal_recursive"]
          assert r["constructor_contract"]["role_dim"] == 32
          assert r["constructor_contract"]["alpha"] == 0.1
          assert r["constructor_contract"]["address_beta"] == 16.0
          assert r["constructor_contract"]["diagnostic_role_count"] == 32
          assert r["constructor_contract"]["frozen_random_constructor_trainable"] is False
          assert r["memory_contract"]["physical_fixed_slot_bank"] is False
          assert r["memory_contract"]["learned_role_to_slot_scorer"] is False
          assert r["memory_contract"]["direct_command_index_record_access"] is False
          assert r["memory_contract"]["collision_repair"] is False
          assert r["supervision_contract"]["role_separation_loss"] is False
          assert r["supervision_contract"]["pretraining_unseen_role_generation"] is False
          for mode in ("frozen_random_orthogonal", "orthogonal_recursive"):
              assert r["initial_orthogonality_error"][mode] <= 1e-5
              assert r["final_orthogonality_error"][mode] <= 1e-5
          for mode in ("canonical_keyed", "frozen_random_orthogonal", "unconstrained_recursive", "orthogonal_recursive"):
              assert set(r["initial_address_train_cardinalities_only"][mode]) == {"2","3","4"}
              for n in range(2,7):
                  s = r["final_address"][mode][str(n)]
                  assert math.isfinite(s["mean_soft_self_address_probability"])
                  assert 0.0 <= s["mean_soft_self_address_probability"] <= 1.0
          for mode in ("frozen_random_orthogonal", "unconstrained_recursive", "orthogonal_recursive"):
              d = r["constructor_diagnostics_posttraining_only"][mode]
              assert d["count"] == 32
              assert len(d["role_norms"]) == 32
              assert len(d["perturbation_stability"]) == 8
          for values in (r["minimum_answer_loss"], r["final_answer_loss"], r["maximum_post4000_grad_norm"]):
              assert all(math.isfinite(v) and v >= 0 for v in values.values())
          print("X19D provenance contract PASS")
          PY
      - name: Upload X19D result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-x19d-seed-${{ matrix.seed }}
          path: casm_v01/casm-x19d-output/
          if-no-files-found: error
          retention-days: 90
