name: Replay CASM multi-seed experiments — CASM-Bench v1

on:
  push:
    branches: ["benchmark/unified-harness-v2"]
    paths: [".github/workflows/replay-casm-bench-v1-multiseed.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replicate:
    name: casm-bench-${{ matrix.phase }}-${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {phase: v01, seed: 20260911}
          - {phase: v01, seed: 20260912}
          - {phase: v01, seed: 20260913}
          - {phase: compression-qk, seed: 20260921}
          - {phase: compression-qk, seed: 20260922}
          - {phase: compression-qk, seed: 20260923}
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONHASHSEED: "20260831"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and validate frozen benchmark
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
          cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
          PYTHONPATH=casm_v01 pytest -q casm_v01/tests/test_benchmark_v1.py
      - name: Train exact historical seed protocol
        shell: bash
        run: |
          set -euxo pipefail
          OUT="replay-multiseed/${{ matrix.phase }}-${{ matrix.seed }}"
          mkdir -p "$OUT"
          if [ '${{ matrix.phase }}' = 'v01' ]; then
            PYTHONPATH=casm_v01 python -m casm.train --tiny \
              --steps 800 --batch-size 8 --seq-len 193 --eval-batches 20 --log-every 200 \
              --compression-warmup 125 --gzip-teacher-decay 650 --gzip-teacher-floor 0.35 \
              --answer-weight 8 --hard-max-prob 0.5 --hard-ramp-steps 500 \
              --seed '${{ matrix.seed }}' --out "$OUT"
          else
            PYTHONPATH=casm_v01 python -m casm.train --tiny \
              --steps 800 --batch-size 8 --seq-len 193 --eval-batches 20 --log-every 200 \
              --compression-warmup 125 --gzip-teacher-decay 650 --gzip-teacher-floor 0.35 \
              --answer-weight 8 --hard-max-prob 0.5 --hard-ramp-steps 500 \
              --seed '${{ matrix.seed }}' --models qk-memory,compression-qk,compression \
              --out "$OUT"
          fi
      - name: CASM-Bench v1 DEV replay
        shell: bash
        run: |
          set -euxo pipefail
          OUT="replay-multiseed/${{ matrix.phase }}-${{ matrix.seed }}"
          if [ '${{ matrix.phase }}' = 'v01' ]; then
            CPS="$OUT/local-only.pt $OUT/qk-memory.pt $OUT/compression.pt $OUT/compression-qk.pt"
          else
            CPS="$OUT/qk-memory.pt $OUT/compression-qk.pt $OUT/compression.pt"
          fi
          PYTHONPATH=casm_v01 python -m casm.run_benchmark_v1_all $CPS \
            --family base --suite dev-core --diagnostics --out "$OUT/casm-bench-v1-dev-core.json"
          PYTHONPATH=casm_v01 python -m casm.run_benchmark_v1_all $CPS \
            --family base --suite dev-ood --diagnostics --out "$OUT/casm-bench-v1-dev-ood.json"
          printf '{"phase":"%s","seed":%s,"benchmark":"CASM-Bench-v1.0"}\n' \
            '${{ matrix.phase }}' '${{ matrix.seed }}' > "$OUT/replay-metadata.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: casm-bench-v1-${{ matrix.phase }}-${{ matrix.seed }}
          path: replay-multiseed/${{ matrix.phase }}-${{ matrix.seed }}/
          if-no-files-found: warn
          retention-days: 90
