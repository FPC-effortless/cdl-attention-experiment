name: Replay verified and provisional dialogue state
on:
  push:
    branches: [research/multiwoz-provisional-belief]
    paths:
      - 'research/cog-attn-handoff/continuation/multiwoz-belief/**'
      - '.github/workflows/multiwoz-belief-replay.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 joblib==1.5.3 scikit-learn==1.8.0
      - working-directory: research/cog-attn-handoff/continuation/multiwoz-belief
        run: |
          sha256sum --quiet -c SHA256SUMS
          python test_belief.py
          python audit.py
          python hosted.py
