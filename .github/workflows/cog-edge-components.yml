name: COG-EDGE component qualification
on:
  pull_request:
    paths:
      - 'research/cog-edge-components/**'
      - '.github/workflows/cog-edge-components.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - run: |
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Restore and verify original evidence
        run: python research/cog-edge-v01/restore.py --out "${RUNNER_TEMP}/edge"
      - name: Execute component checks
        run: |
          set -euo pipefail
          mkdir -p ci-components
          python research/cog-edge-components/component_audit.py --restored "${RUNNER_TEMP}/edge" --out ci-components/results.json 2>&1 | tee ci-components/run.log
          python -m pip freeze > ci-components/environment.txt
          lscpu > ci-components/cpu.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cog-edge-component-evidence
          path: ci-components/
          if-no-files-found: warn
      - name: Preserve run-specific evidence
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/cog-edge-component-qualification'
        run: |
          set -euo pipefail
          test -d ci-components || exit 0
          git config user.name "COG research CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dst="research/cog-edge-components/ci-evidence/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$dst"
          cp -a ci-components/. "$dst/"
          (cd "$dst"; find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          git add -f "$dst"
          git diff --cached --quiet && exit 0
          git commit -m "Preserve COG-EDGE component audit $GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/research/cog-edge-components-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
