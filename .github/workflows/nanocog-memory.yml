name: NanoCOG memory

on:
  push:
    paths:
      - 'research/nanocog-001/nanocog/**'
      - 'research/nanocog-001/memory-validation-002/**'
      - '.github/workflows/nanocog-memory.yml'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'research/nanocog-001/nanocog/**'
      - 'research/nanocog-001/memory-validation-002/**'
      - '.github/workflows/nanocog-memory.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  cpu-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested CPU dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 pytest==8.4.2
      - name: Check SQLite deletion support
        run: python -c "import sqlite3; assert sqlite3.sqlite_version_info >= (3, 42, 0), sqlite3.sqlite_version"
      - name: Run persistence and existing reference checks
        working-directory: research/nanocog-001
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python -m pytest -q nanocog
      - name: Exercise concurrent processes and interrupted transactions
        working-directory: research/nanocog-001
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python memory-validation-002/storage/run_adversarial.py --output "$RUNNER_TEMP/nanocog-memory-system.json"
