name: CASM Phase-1 DAG

on:
  workflow_dispatch:
    inputs:
      train_size:
        description: Training episodes
        required: false
        default: "128"
      test_size:
        description: Test episodes
        required: false
        default: "64"
  push:
    paths:
      - "casm_v01/phase1_dag/**"
      - ".github/workflows/casm-phase1.yml"
      - "requirements.txt"

jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CASM dependencies
        run: pip install -r requirements.txt
      - name: Compile CASM Phase-1 package
        run: python -m compileall -q casm_v01/phase1_dag
      - name: Run unit and invariant tests
        run: pytest -q casm_v01/phase1_dag/test_phase1.py
      - name: Run short Phase-1 experiment
        run: python -m casm_v01.phase1_dag.runner --train-size 16 --test-size 8 --output /tmp/phase1-results.json
      - name: Publish short-run results
        uses: actions/upload-artifact@v4
        with:
          name: casm-phase1-short-run
          path: /tmp/phase1-results.json
