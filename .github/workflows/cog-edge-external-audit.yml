name: COG-EDGE external evidence and distribution audit
on:
  pull_request:
    paths:
      - 'research/cog-edge-external-audit/**'
      - '.github/workflows/cog-edge-external-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5
      - name: Restore pinned external and source receipts
        run: |
          set -euo pipefail
          mkdir -p ci-audit "${RUNNER_TEMP}/external" "${RUNNER_TEMP}/original"
          git fetch --no-tags --depth=1 origin refs/heads/research/cog-edge-external-evidence-46066877217-1
          test "$(git rev-parse FETCH_HEAD)" = 734ec4d6bcaef3a9cc85fea83d79bea86d3ff6e4
          git archive FETCH_HEAD research/cog-edge-external-001/ci-evidence/46066877217-1 | tar -x --strip-components=4 -C "${RUNNER_TEMP}/external"
          (cd "${RUNNER_TEMP}/external"; sha256sum -c SHA256SUMS.txt) | tee ci-audit/custody.log
          git fetch --no-tags --depth=1 origin refs/heads/research/cog-edge-v01-expanded-evidence-46052547333-1
          test "$(git rev-parse FETCH_HEAD)" = 78a432daec384336911b97852f7995ea47f0ccc5
          git show FETCH_HEAD:research/cog-edge-v01-expanded/ci-evidence/46052547333-1/source-manifest.json > "${RUNNER_TEMP}/original/source-manifest.json"
      - name: Independently reconstruct both battery datasets
        run: |
          set -euo pipefail
          python research/cog-edge-v01/restore.py --out "${RUNNER_TEMP}/edge"
          python research/cog-edge-v01-expanded/prepare_expanded.py --restored-source "${RUNNER_TEMP}/edge" --archive research/cog-drone-audit/archives/COG-DRONE-002-006-evidence.zip --out "${RUNNER_TEMP}/expanded.npz" 2>&1 | tee ci-audit/source.log
          python research/cog-edge-external-001/acquire.py --out "${RUNNER_TEMP}/cmu" 2>&1 | tee ci-audit/external-acquisition.log
      - name: Audit stored metrics and descriptive data shift
        run: |
          set -euo pipefail
          python research/cog-edge-external-audit/audit.py --archive "${RUNNER_TEMP}/external" --reconstructed "${RUNNER_TEMP}/cmu" --source "${RUNNER_TEMP}/expanded.npz" --source-manifest "${RUNNER_TEMP}/original/source-manifest.json" --out ci-audit 2>&1 | tee ci-audit/run.log
          python -m pip freeze > ci-audit/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-aggregation-audit
          path: ci-audit/
          if-no-files-found: warn
      - name: Preserve run-specific evidence
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/cog-edge-external-audit'
        run: |
          set -euo pipefail
          test -d ci-audit || exit 0
          git config user.name "COG research CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dst="research/cog-edge-external-audit/ci-evidence/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$dst"
          cp -a ci-audit/. "$dst/"
          (cd "$dst"; find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          git add -f "$dst"
          git diff --cached --quiet && exit 0
          git commit -m "Preserve external audit $GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/research/cog-edge-external-audit-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
