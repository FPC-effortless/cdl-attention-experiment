name: CASM Phase 1 smoke

on:
  pull_request:
    paths:
      - 'casm_v01/phase1_dag/casm_s.py'
      - 'casm_v01/phase1_dag/run_phase1.py'
      - 'casm_v01/tests/test_phase1_casm_s.py'
      - '.github/workflows/casm-phase1-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyTorch
        run: python -m pip install --disable-pip-version-check torch
      - name: Mechanical tests
        run: python -m unittest casm_v01.tests.test_phase1_casm_s -v
      - name: Minimal training smoke
        run: python -m casm_v01.phase1_dag.run_phase1 --steps 20 --warmup 10 --train 16
