name: COG-UNIFIED-TRACE-007 whole-model learning-rule search
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/cog-competence-distance-011]
    paths:
      - 'research/unified-trace-007/**'
      - '.github/workflows/cog-unified-trace-007.yaml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cog-unified-trace-007-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '4'
jobs:
  prepare:
    if: (github.event_name == 'workflow_dispatch' && github.ref_name == 'research/cog-unified-trace-007') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'research/cog-unified-trace-007' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.3.5 safetensors==0.7.0 packaging==25.0
      - uses: actions/download-artifact@v4
        with:
          name: corpus
          path: ${{ runner.temp }}/corpus
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '46039004295'
      - name: Exact parents and independent audit, then all 12 engineering configurations
        run: |
          set -euo pipefail
          test -f research/competence-distance-011/competence.py
          python research/math-repair-009/recover009.py corpus --data "$RUNNER_TEMP/corpus"
          mkdir -p "$RUNNER_TEMP/preflight"
          python research/unified-trace-007/trace.py audit --data "$RUNNER_TEMP/corpus" --out "$RUNNER_TEMP/preflight/audit.json" --threads 4
          python research/unified-trace-007/trace.py preflight --data "$RUNNER_TEMP/corpus" --out "$RUNNER_TEMP/preflight/preflight.json" --threads 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-007-preflight
          path: ${{ runner.temp }}/preflight
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: trace-007-corpus
          path: ${{ runner.temp }}/corpus
          if-no-files-found: error
          retention-days: 30
  train:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        arm: [NN_native_native, SS_native_native, SS_presence_factor, BB_presence_factor, GQA, GATED_DELTA_REF]
        regime: [final, trace]
        seed: [9601, 9611, 9629]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.3.5 safetensors==0.7.0 packaging==25.0
          python -m pip freeze > "$RUNNER_TEMP/environment.txt"
      - uses: actions/download-artifact@v4
        with:
          name: trace-007-corpus
          path: ${{ runner.temp }}/corpus
      - name: Matched complete-model fit with causal intermediate targets
        run: |
          python research/unified-trace-007/trace.py train --arm '${{ matrix.arm }}' --regime '${{ matrix.regime }}' --seed '${{ matrix.seed }}' --data "$RUNNER_TEMP/corpus" --out "$RUNNER_TEMP/fit" --threads 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-007-fit-${{ matrix.arm }}-${{ matrix.regime }}-${{ matrix.seed }}
          path: |
            ${{ runner.temp }}/fit/
            ${{ runner.temp }}/environment.txt
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.3.5 safetensors==0.7.0 packaging==25.0
      - uses: actions/download-artifact@v4
        with:
          pattern: trace-007-fit-*
          path: ${{ runner.temp }}/fits
      - run: python research/unified-trace-007/trace.py aggregate --input "$RUNNER_TEMP/fits" --out "$RUNNER_TEMP/summary/comparison.json" --threads 4
      - uses: actions/upload-artifact@v4
        with:
          name: trace-007-comparison
          path: ${{ runner.temp }}/summary
          if-no-files-found: error
          retention-days: 30
