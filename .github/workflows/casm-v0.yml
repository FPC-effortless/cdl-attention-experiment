name: CASM v0 controlled training

on:
  push:
    branches:
      - model/compression-attention-v0
    paths:
      - "model/**"
      - ".github/workflows/casm-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "20260829"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest

      - name: Unpack CASM source
        run: |
          rm -rf casm-work
          mkdir -p casm-work
          unzip -q model/casm-v0-source.zip -d casm-work
          find casm-work -maxdepth 3 -type f -print

      - name: Unit and gradient tests
        working-directory: casm-work
        run: |
          PYTHONPATH=. pytest -q

      - name: Train paired ablations
        working-directory: casm-work
        run: |
          PYTHONPATH=. python -m casm.train \
            --tiny \
            --steps 600 \
            --batch-size 8 \
            --seq-len 97 \
            --eval-batches 16 \
            --log-every 100 \
            --compression-warmup 100 \
            --gzip-teacher-decay 400 \
            --gzip-teacher-floor 0.25 \
            --seed 20260829 \
            --out casm-output

      - name: Evaluate heterogeneous tasks
        working-directory: casm-work
        run: |
          PYTHONPATH=. python -m casm.eval_tasks \
            casm-output/local-only.pt \
            casm-output/qk-memory.pt \
            casm-output/compression.pt \
            --n-per-task 60 \
            --seed 20260830 \
            > casm-output/task-eval.txt
          cat casm-output/task-eval.txt

      - name: Preserve experiment metadata
        working-directory: casm-work
        run: |
          python - <<'PY'
          import json, platform, torch
          from pathlib import Path
          meta = {
              "experiment": "CASM-v0-controlled-600",
              "seed": 20260829,
              "eval_seed": 20260830,
              "steps_per_variant": 600,
              "variants": ["local-only", "qk-memory", "compression"],
              "torch": torch.__version__,
              "python": platform.python_version(),
              "device": "cpu",
          }
          Path("casm-output/run-metadata.json").write_text(json.dumps(meta, indent=2))
          PY

      - name: Upload CASM results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-v0-results
          path: casm-work/casm-output/
          if-no-files-found: warn
          retention-days: 90
