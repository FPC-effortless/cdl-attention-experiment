name: CASM-X8 unconstrained binding topology

on:
  push:
    branches:
      - experiment/casm-x8-unconstrained-binding
    paths:
      - "casm_v01/casm/unconstrained_binding.py"
      - "casm_v01/casm/run_unconstrained_binding.py"
      - "casm_v01/tests/test_unconstrained_binding.py"
      - "casm_v01/EXPERIMENT_CASM_X8.md"
      - ".github/workflows/casm-x8-unconstrained-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Run X8 topology integrity tests
        run: PYTHONPATH=casm_v01 pytest -q casm_v01/tests/test_unconstrained_binding.py casm_v01/tests/test_surplus_slot_binding.py casm_v01/tests/test_fixed_answer_register.py

  train-evaluate:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 20261011
            eval_seed: 20261091
          - seed: 20261012
            eval_seed: 20261092
          - seed: 20261013
            eval_seed: 20261093
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Assemble CASM package model
        run: cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
      - name: Train and evaluate binding topologies
        working-directory: casm_v01
        run: |
          PYTHONPATH=. python -m casm.run_unconstrained_binding \
            --steps 8000 \
            --batch-size 128 \
            --train-depth 8 \
            --binding-temperature 1.0 \
            --eval-n 384 \
            --eval-batch-size 64 \
            --seed ${{ matrix.seed }} \
            --eval-seed ${{ matrix.eval_seed }} \
            --output casm-x8-output/results-${{ matrix.seed }}.json
      - name: Validate contract and print decisive metrics
        working-directory: casm_v01
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = next(Path("casm-x8-output").glob("results-*.json"))
          report = json.loads(path.read_text())
          contract = report["supervision_contract"]

          assert report["harness_version"] == "casm-x8-unconstrained-binding-v1-2026-08-31"
          assert report["steps"] == 8000
          assert report["train_depth"] == 8
          assert report["binding_temperature"] == 1.0
          assert contract["teacher_forcing"] is False
          assert contract["semantic_operator_labels"] is False
          assert contract["intermediate_state_targets"] is False
          assert contract["binding_labels"] is False
          assert contract["binding_regularizer"] is False
          assert contract["collision_penalty"] is False
          assert contract["identity_prior"] is False
          assert contract["external_register_count"] == 4
          assert contract["candidate_internal_slot_count"] == 8
          assert contract["surplus_symbol"] == "EMPTY"
          assert contract["learned_dense_row_normalized"] is True
          assert contract["learned_dense_injective_constraint"] is False
          assert contract["learned_dense_column_capacity_constraint"] is False
          assert contract["learned_dense_hard_evaluation"] == "independent_row_argmax_without_collision_repair"
          assert contract["all_register_specific_access_passes_through_binding"] is True
          assert len(set(report["parameters"].values())) == 1
          assert len(set(report["trainable_parameters"].values())) == 1
          assert all(
              math.isfinite(v) and v >= 0.0
              for v in report["minimum_training_loss"].values()
          )

          initial = report["initial_binding_stats"]["learned_dense"]
          assert initial["row_max_mean"] < 0.15, initial
          assert initial["max_row_sum_error"] <= 1e-6, initial
          assert abs(initial["total_assignment_mass"] - 4.0) <= 1e-6, initial

          dense = report["final_binding_stats"]["learned_dense"]
          assert dense["max_row_sum_error"] <= 1e-6, dense
          assert abs(dense["total_assignment_mass"] - 4.0) <= 1e-6, dense
          assert len(dense["independent_argmax_assignment"]) == 4
          assert 1 <= dense["independent_argmax_unique_slot_count"] <= 4
          assert dense["independent_argmax_collision_count"] == 4 - dense["independent_argmax_unique_slot_count"]

          injective = report["final_binding_stats"]["learned_injective"]
          assert injective["max_row_sum_error"] <= 1e-6, injective
          assert injective["max_column_occupancy"] <= 1.0 + 1e-6, injective
          assert len(set(injective["best_injective_assignment"])) == 4

          for block in (dense, injective):
              for key in (
                  "row_max_mean",
                  "row_entropy_mean",
                  "best_injective_score",
                  "max_column_occupancy",
                  "min_column_occupancy",
              ):
                  assert math.isfinite(block[key]), (key, block[key])

          print("parameters", report["parameters"])
          print("minimum_training_loss", report["minimum_training_loss"])
          print("initial_dense", initial)
          print("final_dense", dense)
          print("final_injective", injective)

          for eval_name in ("evaluation", "soft_evaluation"):
              print("\n", eval_name)
              for suite in (
                  "iid_depth_8",
                  "composition_depth_12",
                  "composition_depth_24",
                  "stress_depth_48",
                  "stress_depth_96",
              ):
                  row = report[eval_name][suite]
                  print(suite)
                  for mode in (
                      "canonical_sparse",
                      "learned_injective",
                      "learned_dense",
                      "diffuse_dense",
                  ):
                      metrics = row[mode]
                      for key in (
                          "final_state_exact",
                          "step_state_exact",
                          "register_accuracy",
                          "answer_final_accuracy",
                          "answer_step_accuracy",
                          "hidden_register_accuracy",
                          "hidden_final_exact",
                      ):
                          assert math.isfinite(metrics[key]), (
                              eval_name,
                              suite,
                              mode,
                              key,
                              metrics[key],
                          )
                      print(
                          mode,
                          "answer", metrics["answer_final_accuracy"],
                          "step", metrics["step_state_exact"],
                          "hidden", metrics["hidden_register_accuracy"],
                      )
          PY
      - name: Upload X8 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-x8-seed-${{ matrix.seed }}
          path: casm_v01/casm-x8-output/
          if-no-files-found: error
          retention-days: 90
