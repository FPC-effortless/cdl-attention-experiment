name: CASM Phase 1 benchmark controls

on:
  push:
    branches: [main, 'feat/casm-phase1-dag-falsification', 'feat/casm-phase1-benchmark-controls-v2']
  pull_request:
    paths:
      - 'casm_v01/phase1_dag/**'
      - 'casm_v01/tests/test_phase1_dag.py'
      - 'casm_v01/tests/test_phase1_benchmark_controls.py'
      - '.github/workflows/casm-phase1-benchmark-controls.yml'

jobs:
  benchmark-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Phase 1 unit tests
        run: python -m unittest casm_v01.tests.test_phase1_dag casm_v01.tests.test_phase1_benchmark_controls -v
      - name: Run benchmark preflight
        run: python -m casm_v01.phase1_dag.benchmark_preflight
