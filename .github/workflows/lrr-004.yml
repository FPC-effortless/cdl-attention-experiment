name: LRR-004 Role Offsets and Open-Set Falsifiers

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lrr-004.yml"
      - "relational_router/lrr004_locality.py"
      - "relational_router/run_lrr004.py"
      - "relational_router/test_lrr004.py"
      - "relational_router/EXPERIMENT_LRR004.md"

jobs:
  five-seed-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Minimal CPU scientific dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install "pytest>=8,<9" numpy
      - name: Syntax and scientific-integrity tests
        run: |
          python -m compileall -q relational_router
          python -m pytest -q relational_router/test_lrr004.py
      - name: Frozen five-seed paired comparison
        run: |
          python -m relational_router.run_lrr004 \
            --seeds 31,32,33,34,35 \
            --lengths 6,32,128 \
            --trials 64 \
            --steps 700 \
            --batch-size 48 \
            --output /tmp/lrr004-results.json \
            --checkpoint-dir /tmp/lrr004-checkpoints \
            > /tmp/lrr004-stdout.txt
          cat /tmp/lrr004-stdout.txt
      - name: Preserve full unfiltered outcomes and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lrr-004-five-seed-outcomes-checkpoints
          path: |
            /tmp/lrr004-results.json
            /tmp/lrr004-stdout.txt
            /tmp/lrr004-checkpoints/*.pt
          if-no-files-found: warn
