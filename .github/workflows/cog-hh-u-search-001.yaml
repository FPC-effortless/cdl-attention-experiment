name: COG-HH-U-SEARCH-001 structural module search
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [research/cog-math-repair-009-cpu]
    paths:
      - 'research/hh-u-search-001/**'
      - '.github/workflows/cog-hh-u-search-001.yaml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cog-hh-u-search-001-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '4'
jobs:
  prepare:
    if: (github.event_name == 'workflow_dispatch' && github.ref_name == 'research/cog-hh-u-search-001') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'research/cog-hh-u-search-001' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.3.5 safetensors==0.7.0 packaging==25.0
      - uses: actions/download-artifact@v4
        with:
          name: corpus
          path: ${{ runner.temp }}/corpus
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '46039004295'
      - uses: actions/download-artifact@v4
        with:
          name: stage4-U-9001
          path: ${{ runner.temp }}/unified
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '46044686359'
      - name: Verify exact corpus and all 16 structural variants
        run: |
          python research/math-repair-009/recover009.py corpus --data "$RUNNER_TEMP/corpus"
          python research/hh-u-search-001/preflight.py --data "$RUNNER_TEMP/corpus" --parent "$RUNNER_TEMP/unified" --out "$RUNNER_TEMP/preflight/report.json" --threads 4
          python -m py_compile research/hh-u-search-001/*.py
      - uses: actions/upload-artifact@v4
        with:
          name: hh-u-preflight
          path: ${{ runner.temp }}/preflight
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: hh-u-corpus
          path: ${{ runner.temp }}/corpus
          retention-days: 30
          if-no-files-found: error
  train:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arm: ['NN','SS','BB','NS','SN','NR','RN','RR','SR','RS','NB','BN','SB','BS','RB','BR']
        seed: [9301,9311,9329]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.3.5 safetensors==0.7.0 packaging==25.0
      - uses: actions/download-artifact@v4
        with:
          name: hh-u-corpus
          path: ${{ runner.temp }}/corpus
      - name: Matched 1024-update structural search
        run: |
          python research/hh-u-search-001/train_search.py --arm '${{ matrix.arm }}' --seed '${{ matrix.seed }}' --data "$RUNNER_TEMP/corpus" --out "$RUNNER_TEMP/fit" --threads 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hh-u-fit-${{ matrix.arm }}-${{ matrix.seed }}
          path: ${{ runner.temp }}/fit
          retention-days: 30
          if-no-files-found: warn
  aggregate:
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: hh-u-fit-*
          path: ${{ runner.temp }}/fits
      - run: python research/hh-u-search-001/aggregate.py --input "$RUNNER_TEMP/fits" --out "$RUNNER_TEMP/summary/comparison.json"
      - uses: actions/upload-artifact@v4
        with:
          name: hh-u-comparison
          path: ${{ runner.temp }}/summary
          retention-days: 30
          if-no-files-found: error
