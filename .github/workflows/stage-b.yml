name: Stage B CDL distillation

on:
  workflow_dispatch:
  push:
    paths:
      - app.py
      - run_stage_b.py
      - requirements.txt
      - .github/workflows/stage-b.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install benchmark dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Stage B CDL distillation
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python run_stage_b.py
      - name: Upload Stage B outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-b-results
          path: stage-b-output/
          if-no-files-found: warn
