name: COG-EDGE expanded telemetry acquisition repair
on:
  pull_request:
    paths:
      - 'research/cog-edge-v01-expanded/**'
      - '.github/workflows/cog-edge-v01-expanded.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expanded:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - run: |
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Pinned acquisition and unchanged data gates
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          python research/cog-edge-v01/restore.py --out "${RUNNER_TEMP}/edge"
          python research/cog-edge-v01-expanded/prepare_expanded.py --restored-source "${RUNNER_TEMP}/edge" --archive research/cog-drone-audit/archives/COG-DRONE-002-006-evidence.zip --out "${RUNNER_TEMP}/expanded.npz" 2>&1 | tee ci-evidence/acquisition.log
          cp "${RUNNER_TEMP}/expanded.json" ci-evidence/source-manifest.json
      - name: Run tuned classical forecast control
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,pathlib,zipfile,os
          a=pathlib.Path('research/cog-edge-v01-expanded/kalman-diagnostic.zip')
          assert hashlib.sha256(a.read_bytes()).hexdigest()=='51f7ed704287742d96bbc1785f53fcc6a2e8840a5d31089a81d5102720f94e8c'
          with zipfile.ZipFile(a) as z:
           pathlib.Path(os.environ['RUNNER_TEMP'],'edge','kalman.py').write_bytes(z.read('kalman.py'))
          PY
          python "${RUNNER_TEMP}/edge/kalman.py" --dataset "${RUNNER_TEMP}/expanded.npz" --out ci-evidence/kalman-results.json 2>&1 | tee ci-evidence/kalman.log
      - name: Train all expanded aircraft folds
        run: |
          set -euo pipefail
          for g in Y R G; do
            python "${RUNNER_TEMP}/edge/edge.py" --dataset "${RUNNER_TEMP}/expanded.npz" --fold "$g" --out "ci-evidence/expanded-$g" --updates 600 2>&1 | tee "ci-evidence/train-$g.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-expanded-repair-evidence
          path: ci-evidence/
          if-no-files-found: warn
      - name: Commit all available results on immutable run-specific branch
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/cog-edge-v01-expanded'
        run: |
          set -euo pipefail
          test -d ci-evidence || exit 0
          git config user.name "COG research CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dst="research/cog-edge-v01-expanded/ci-evidence/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$dst"
          cp -a ci-evidence/. "$dst/"
          (cd "$dst"; find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          git add -f "$dst"
          git diff --cached --quiet && exit 0
          git commit -m "Preserve COG-EDGE expanded research run $GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/research/cog-edge-v01-expanded-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
