name: CASM-R scoped-memory control

on:
  push:
    branches:
      - experiment/casm-r-scoped-memory
    paths:
      - "casm_v01/**"
      - ".github/workflows/casm-r-scoped-train.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "20261121"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest

      - name: Assemble and test scoped control
        run: |
          cat casm_v01/casm/model_part1.py casm_v01/casm/model_part2.py > casm_v01/casm/model.py
          PYTHONPATH=casm_v01 pytest -q \
            casm_v01/tests/test_scoped_data.py \
            casm_v01/tests/test_data_v2.py \
            casm_v01/tests/test_recurrent.py

      - name: Scoped recurrent smoke train
        run: |
          PYTHONPATH=casm_v01 python -m casm.train_recurrent_scoped \
            --tiny --steps 20 --batch-size 4 --seq-len 289 --eval-batches 1 \
            --log-every 10 --seed 20261120 --out scoped-smoke

      - name: Train one-episode-per-memory-lifetime models
        run: |
          PYTHONPATH=casm_v01 python -m casm.train_recurrent_scoped \
            --tiny \
            --steps 2000 \
            --batch-size 16 \
            --seq-len 289 \
            --eval-batches 20 \
            --log-every 100 \
            --answer-weight 12 \
            --hard-max-prob 0.5 \
            --hard-ramp-steps 800 \
            --seed 20261121 \
            --out casm-r-scoped-output

      - name: Corrected heterogeneous tasks
        run: |
          PYTHONPATH=casm_v01 python -m casm.eval_recurrent \
            casm-r-scoped-output/scoped-qk-1step.pt \
            casm-r-scoped-output/scoped-qk-3step.pt \
            --mode task --n 120 --seed 20261122 \
            > casm-r-scoped-output/task-eval.txt
          cat casm-r-scoped-output/task-eval.txt

      - name: Long-horizon structural stress
        run: |
          PYTHONPATH=casm_v01 python -m casm.eval_recurrent \
            casm-r-scoped-output/scoped-qk-1step.pt \
            casm-r-scoped-output/scoped-qk-3step.pt \
            --mode stress --n 80 --seed 20261123 \
            > casm-r-scoped-output/stress-eval.txt
          cat casm-r-scoped-output/stress-eval.txt

      - name: True autoregressive solve rate
        run: |
          PYTHONPATH=casm_v01 python -m casm.eval_recurrent \
            casm-r-scoped-output/scoped-qk-1step.pt \
            casm-r-scoped-output/scoped-qk-3step.pt \
            --mode freegen --n 60 --max-new-tokens 8 --seed 20261124 \
            > casm-r-scoped-output/free-generate-eval.txt
          cat casm-r-scoped-output/free-generate-eval.txt

      - name: Test-time recurrent depth sweep
        run: |
          PYTHONPATH=casm_v01 python -m casm.eval_recurrent \
            casm-r-scoped-output/scoped-qk-3step.pt \
            --mode stress --n 40 --depths 1,3,5 --seed 20261125 \
            > casm-r-scoped-output/depth-sweep.txt
          cat casm-r-scoped-output/depth-sweep.txt

      - name: Preserve metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path('casm-r-scoped-output/run-metadata.json').write_text(json.dumps({
            'experiment': 'CASM-R-scoped-memory',
            'seed': 20261121,
            'steps': 2000,
            'batch_size': 16,
            'training_scope': 'one independent task per row / clean memory lifetime',
            'models': ['scoped-qk-1step', 'scoped-qk-3step'],
          }, indent=2))
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casm-r-scoped-memory-results
          path: casm-r-scoped-output/
          if-no-files-found: warn
          retention-days: 90
